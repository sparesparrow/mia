# Shared strings for the published site: "what works today",
# audience navigation, pilot call to action and the press kit.
# "What works today" may only list behaviour whose requirement in spec/requirements/
# is implemented_and_ci_tested or better (ADR-0010). Update it when evidence changes.
site:
  brand:
    en: MIA
    cs: MIA
  tagline:
    en: Open prototype of in-car telemetry and a voice assistant
    cs: Otevřený prototyp telemetrie a hlasového asistenta do auta
  language_switch:
    en: Česky
    cs: English
  skip_link:
    en: Skip to content
    cs: Přeskočit na obsah
  facts:
    - en: Built on an Audi A4 Cabriolet 8H
      cs: Vyvíjeno na Audi A4 Cabriolet 8H
    - en: Raspberry Pi 4B + ESP32 + Android
      cs: Raspberry Pi 4B + ESP32 + Android
    - en: Read-only access to the vehicle
      cs: Z vozidla pouze čte
  nav:
    today:
      en: Works today
      cs: Funguje dnes
    scenarios:
      en: Scenarios
      cs: Scénáře
    technology:
      en: Technology
      cs: Technologie
    pilot:
      en: Join the pilot
      cs: Zapojit se
    all_pages:
      en: All pages
      cs: Všechny stránky
  today:
    title:
      en: What works today
      cs: Co funguje dnes
    intro:
      en: "No slide deck. This is written and passes automated tests in CI or runs in simulation. Bench, hardware and in-car validation is still under way."
      cs: "Žádné slajdy. Tohle je napsané a prošlo automatickými testy v CI nebo běží v simulaci. Na stole, na hardwaru a v autě to teprve ověřujeme."
    link:
      en: Evidence state of every requirement
      cs: Stav ověření každého požadavku
    items:
      - title:
          en: OBD-II telemetry
          cs: Telemetrie OBD-II
        text:
          en: Engine speed, coolant temperature, battery voltage and ignition state, from an ELM327 digital twin and passive CAN capture on ESP32.
          cs: Otáčky, teplota chladicí kapaliny, napětí baterie a stav zapalování z digitálního dvojčete ELM327 a pasivního záznamu CAN na ESP32.
      - title:
          en: Read-only Audi diagnostics
          cs: Diagnostika Audi jen pro čtení
        text:
          en: A VAG/Audi diagnostics bridge that only reads. MIA does not write to the vehicle bus by default.
          cs: Diagnostický most VAG/Audi, který pouze čte. MIA ve výchozím stavu na sběrnici vozidla nezapisuje.
      - title:
          en: Number plate recognition
          cs: Rozpoznávání SPZ
        text:
          en: Plate recognition in the Android app; the Czech motorway vignette check runs on the Pi.
          cs: Rozpoznávání SPZ v aplikaci pro Android; kontrola dálniční známky běží na Pi.
      - title:
          en: Voice commands
          cs: Hlasové ovládání
        text:
          en: Voice command handling on the Pi and spoken feedback in the Android app.
          cs: Zpracování hlasových příkazů na Pi a mluvená zpětná vazba v aplikaci pro Android.
      - title:
          en: Android companion app
          cs: Aplikace pro Android
        text:
          en: BLE pairing, a live telemetry card and a local rules engine. Dashcam recording is still in development.
          cs: Párování přes BLE, živá karta telemetrie a místní pravidla. Záznam z kamery je zatím ve vývoji.
      - title:
          en: Raspberry Pi gateway
          cs: Brána na Raspberry Pi
        text:
          en: REST and WebSocket API, ZeroMQ messaging and systemd services, with simulation fallbacks when hardware is absent.
          cs: REST a WebSocket API, zprávy přes ZeroMQ a služby systemd, se simulací tam, kde hardware chybí.
  scenarios:
    label:
      en: Planned scenarios
      cs: Plánované scénáře
    note:
      en: "This is a plan, not a promise. None of it is finished or validated yet."
      cs: "Tohle je plán, ne slib. Nic z toho zatím není hotové ani ověřené."
  technology:
    title:
      en: Technology
      cs: Technologie
    items:
      - title:
          en: "Raspberry Pi 4B under the seat"
          cs: "Raspberry Pi 4B pod sedačkou"
        text:
          en: "The API, messaging and AI services run right in the car, not in someone else's data centre."
          cs: "API, zprávy a AI služby běží přímo v autě, ne v cizím datacentru."
      - title:
          en: "ESP32s behind the dash"
          cs: "ESP32 za palubkou"
        text:
          en: "They listen on OBD-II and CAN and drive local inputs and outputs. They write nothing to the control units."
          cs: "Poslouchají OBD-II a CAN a obsluhují místní vstupy a výstupy. Do řídicích jednotek nezapisují."
      - title:
          en: "Phone in the mount"
          cs: "Telefon v držáku"
        text:
          en: "Dashboard, BLE link and plate reading on the driver's phone. The dashcam is still being finished."
          cs: "Palubka, spojení přes BLE a čtení SPZ v telefonu řidiče. Kamera se teprve dodělává."
      - title:
          en: "Cards on the table"
          cs: "Otevřené karty"
        text:
          en: "Requirements, design decisions and validation records are public on GitHub. We hide nothing."
          cs: "Požadavky, návrhová rozhodnutí i záznamy ověření jsou veřejně na GitHubu. Nic neschováváme."
  pilot:
    text:
      en: "There's no price list and we won't make one up. We're looking for pilot crews and partners who aren't afraid of a screwdriver. Tell us what you need and we'll work it out."
      cs: "Ceník nemáme a vymýšlet si ho nebudeme. Hledáme pilotní posádky a partnery, kteří se nebojí šroubováku. Napište, co potřebujete, a domluvíme se."
    button:
      en: Join the pilot
      cs: Zapojit se do pilotu
    docs:
      en: Read the documentation
      cs: Číst dokumentaci
