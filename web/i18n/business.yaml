    title:
        en: "MIA for business – a fleet that doesn't snitch"
        cs: "MIA pro firmy – flotila, která nedonáší"
    description:
        en: "A new company car tells its manufacturer where and how you drive. MIA reads OBD and Audi diagnostics for you alone, runs on a Raspberry Pi under the seat and takes voice commands, so the driver keeps hold of the wheel. No cloud, and she writes nothing to the car."
        cs: "Nové firemní auto hlásí výrobci, kudy a jak jezdíte. MIA čte OBD a diagnostiku Audi jen pro vás, běží na Raspberry Pi pod sedačkou a poslouchá hlasové povely, takže řidič drží volant. Žádný cloud a do auta nic nezapisuje."
