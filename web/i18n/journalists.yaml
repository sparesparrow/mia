  # Overrides for the shared strings in site.yaml on this page only (see generatePages.js).
  site:
    scenarios:
      label:
        en: "What MIA does"
        cs: "Co MIA umí"
      note:
        en: "This is what MIA does while you keep your hands on the wheel."
        cs: "Tohle MIA dělá, zatímco ty držíš volant."
    today:
      title:
        en: "What already runs"
        cs: "Co už teď jede"
      intro:
        en: "No slide deck. This is written, tested in CI and running in simulation. We're bolting it into the car right now."
        cs: "Žádný powerpoint. Tohle je napsané, otestované v CI a běží v simulaci. Do auta to právě šroubujeme."
      items:
        - title:
            en: "What's under the bonnet"
            cs: "Co se děje pod kapotou"
          text:
            en: "RPM, coolant temperature, battery voltage and ignition, from OBD and passive CAN listening."
            cs: "Otáčky, teplota vody, napětí baterie a zapalování z OBD a pasivního odposlechu CAN."
        - title:
            en: "Read-only Audi"
            cs: "Audi jen pro čtení"
          text:
            en: "VAG diagnostics that only read. MIA keeps her hands off the control units."
            cs: "Diagnostika VAG, která jen čte. Do řídicích jednotek MIA nesahá."
        - title:
            en: "Plate reader"
            cs: "Čtečka SPZ"
          text:
            en: "A rear-facing camera reads number plates and checks them against eDálnice straight away."
            cs: "Kamera namířená dozadu čte SPZ a hned je prověří na eDálnici."
        - title:
            en: "Talk, don't fiddle"
            cs: "Mluv, nehrabej"
          text:
            en: "The Pi handles voice commands and the phone speaks the answers."
            cs: "Hlasové příkazy zpracuje Pi, odpovědi ti telefon řekne nahlas."
        - title:
            en: "Phone as a dashboard"
            cs: "Telefon jako palubka"
          text:
            en: "BLE, live telemetry, dashcam and your own “if this, do that” rules."
            cs: "BLE, živá telemetrie, dashcam a vlastní pravidla typu „když tohle, udělej tamto“."
        - title:
            en: "Brain under the seat"
            cs: "Mozek pod sedačkou"
          text:
            en: "A Raspberry Pi with an API, WebSocket and services that start by themselves. No hardware attached? It runs in simulation."
            cs: "Raspberry Pi s API, WebSocketem a službami, co naběhnou samy. Když hardware chybí, jede simulace."
    technology:
      items:
        - title:
            en: "Raspberry Pi under the seat"
            cs: "Raspberry Pi pod sedačkou"
          text:
            en: "API, messaging and voice services run right in the car."
            cs: "API, zprávy a hlasové služby běží přímo v autě."
        - title:
            en: "ESP32s behind the dash"
            cs: "ESP32 za palubkou"
          text:
            en: "They listen to OBD and CAN, switch relays, read buttons, and one watches number plates through the rear camera."
            cs: "Poslouchají OBD a CAN, spínají relé, čtou tlačítka a jedna kouká zadní kamerou na SPZ."
        - title:
            en: "Phone in the mount"
            cs: "Telefon v držáku"
          text:
            en: "Dashboard, dashcam and a scan of the Bluetooth and Wi-Fi addresses around you."
            cs: "Palubka, dashcam a sken Bluetooth a Wi-Fi adres okolo."
        - title:
            en: "Open code"
            cs: "Otevřený kód"
          text:
            en: "Requirements, decisions and test results are on GitHub. We hide nothing."
            cs: "Požadavky, rozhodnutí i výsledky testů jsou na GitHubu. Nic neschováváme."
    pilot:
      text:
        en: "There's no price list and we won't make one up. We're looking for crews who want MIA in their car first and aren't afraid of a screwdriver. Drop us a line."
        cs: "Ceník nemáme a nebudeme si ho vymýšlet. Hledáme posádky, co chtějí MIA v autě první a nebojí se šroubováku. Napiš nám."
