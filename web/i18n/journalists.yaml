    hunter_quote:
      en: "In a world of thieves, the only final sin is stupidity."
      cs: "In a world of thieves, the only final sin is stupidity."
  panic_mode:
    title:
      en: 🚨 EMERGENCY MODE ACTIVATED 🚨
      cs: 🚨 NOUZOVÝ REŽIM AKTIVOVÁN 🚨
    description:
      en: All data is immediately encrypted and ready for self-destruction.
      cs: Všechna data jsou okamžitě šifrována a připravena k self-destruction.
    countdown:
      text:
