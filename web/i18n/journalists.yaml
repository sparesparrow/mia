journalists:
  page:
    title:
      en: MIA - Investigative Journalism AI
      cs: MIA - Digitální Paranoidní Manifestí Na Kolech
    description:
      en: Ultimate tool for investigative reporting with real-time surveillance and voice transcription
      cs: Když tě sledujou, budeš sledovat je. Edge AI pro paranoiky, investigativce a rebelující duše s volantem v rukou.
  navigation:
    gonzo_journalism:
