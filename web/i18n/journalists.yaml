  hero:
    main_title:
      en: When They Watch You, You Watch Them Back
      cs: KDYŽ TĚ SLEDUJOU, BUDEŠ SLEDOVAT JE
    subtitle:
      en: Digital Paranoia on Wheels
      cs: DIGITÁLNÍ PARANOIA NA KOLECH
    description:
      en: "MIA is your co-driver: she sees who's behind you, reads what's going on under the bonnet, and does everything you'd otherwise take your hands off the wheel for. She runs on a Raspberry Pi under your seat, not in someone else's cloud, and sells your car's data to nobody."
      cs: "MIA je parťák do auta: vidí, kdo jede za tebou, čte, co se děje pod kapotou, a dělá za tebe všechno, kvůli čemu bys jinak pustil volant. Běží na Raspberry Pi pod sedačkou, ne v cizím cloudu, a data z auta neprodává nikomu."
    ultimate_tool_for_investigative_reporting:
      en: Ultimate Tool for Investigative Reporting
      cs: Ultimátní nástroj pro investigativní žurnalistiku
    track_suspicious_vehicles:
      en: Track Suspicious Vehicles
      cs: Sledujte podezřelá vozidla
    voice_notes_hands_free:
      en: Voice Notes Hands-Free
      cs: Nahrávejte hlasové poznámky bez použití rukou
    realtime_reporting:
      en: Real-Time Reporting
      cs: Tvořte reportáže v reálném čase během jízdy
    mobile_newsroom:
      en: Mobile Newsroom
      cs: Vaše mobilní redakce s AI sledováním
    stats:
      monitoring:
        en: 24/7 WATCHFUL EYE TECHNOLOGY
        cs: 24/7 BDĚLÝ OKO TECHNOLOGIE
      resistance:
        en: ∞ FUCK THE ESTABLISHMENT
        cs: ∞ FUCK THE ESTABLISHMENT
    buttons:
      join_resistance:
        en: JOIN THE RESISTANCE
        cs: VSTOUPIT DO RESISTANCE
      watch_manifesto:
        en: WATCH MANIFESTO
        cs: SLEDOVAT MANIFESTO
  weaponry:
    title:
      en: "Arsenal for Digital Guerrilla"
      cs: "ARSENAL PRO DIGITÁLNÍ GUERILLU"
    anti_stalker_protocol:
      title:
        en: "Anti-Stalker Protocol"
        cs: "ANTI-STALKER PROTOKOL"
      description:
        en: "When the night fog lifts and your rear wiper catches the same number plate for the sixth time, MIA warns you: Heads up! Someone's riding your ass!"
        cs: "Když se noční mlha rozplyne a tvůj zadní stěrač zahlédne už pošesté tu stejnou SPZ - MIA tě upozorní: Bacha! Máš sledku za prdelí!"
      quote:
        en: "Once is chance. Twice is coincidence. The sixth time it's a tail."
        cs: "Jednou je to náhoda. Dvakrát souhra okolností. Pošesté je to sledka."
    covert_ops_interface:
      title:
        en: "The Plate Black Book"
        cs: "ČERNÁ KNIHA SPZ"
      description:
        en: "Every number plate of the cars driving behind you goes into a database. If they keep showing up, you'll know."
        cs: "Všechny SPZ aut, co jedou za tebou, se ukládají do databáze. Když se budou opakovat, budeš o tom vědět."
      quote:
        en: "Besides the plates from the rear camera, MIA also remembers the Bluetooth and Wi-Fi addresses around you. Plates can be swapped; the phone in your tail's pocket, not so easily."
        cs: "Kromě SPZ ze zadní kamery si MIA pamatuje i Bluetooth a Wi-Fi adresy okolo. Značky se dají přešroubovat, mobil v kapse sledky už tak snadno ne."
    gonzo_command_center:
      title:
        en: "Unmarked Cop Detector"
        cs: "DETEKTOR KRIMINÁLKY"
      description:
        en: "Just because you're paranoid doesn't mean they're not after you: every plate you pass is checked against edalnice.cz. Vehicles exempt from the motorway toll are driven by the criminal police!"
        cs: "Že seš paranoidní neznamená že po tobě nejdou: Všechny potkané SPZ se ověří dotazem na edalnice.cz - vozidla osvobozená od dálničního poplatku řídí kriminálka!"
      quote:
        en: "Only two kinds of people drive without a vignette: the ones who forgot, and the ones who don't have to pay."
        cs: "Bez dálniční známky jezdí jen dva druhy lidí: ti, co zapomněli, a ti, co platit nemusí."
    matrix_tracking_map:
      title:
        en: "Hands on the Wheel"
        cs: "RUCE NA VOLANTU"
      description:
        en: "When you drive, your hands are on the wheel and your eyes on the road. Not even an automatic gearbox lets you fiddle with your phone's settings while driving; MIA does it for you, just talk to her. And when they pull you over, MIA will play your pregnant wife on the phone, the one you're speeding to get to the hospital!"
        cs: "Když řídíš, máš ruce na volantu a oči na silnici. Ani automat ti neposkytne pohodlí sekat se za jízdy v nadstavnení telefonu; MIA to bude dělat za tebe, stačí s ní mluvit. A až tě budou stavět, MIA bude hrát těhotnou manželku na telefonu, pro kterou rychle jedeš abys ji vzal do nemocnice!"
      quote:
        en: "Say “Hey Mia” and leave the phone in its mount."
        cs: "Řekni „Hey Mia“ a telefon nech v držáku."
    obd_whisperer:
      title:
        en: "The Car Talks, MIA Translates"
        cs: "AUTO MLUVÍ, MIA PŘEKLÁDÁ"
      description:
        en: "RPM, coolant temperature, battery voltage, fault codes. MIA reads them from OBD and CAN, and when she doesn't like something she tells you out loud, instead of you hearing it from the tow truck driver. Hook up Torque or Car Scanner if you like: she passes for a plain ELM327 OBD adapter."
        cs: "Otáčky, teplota vody, napětí baterie, chybové kódy. MIA to čte z OBD a CAN, a když se jí něco nelíbí, řekne ti to nahlas, místo aby ses to dozvěděl od odtahovky. Klidně se k ní připoj s Torque nebo Car Scannerem, tváří se jako obyčejný OBD adaptér ELM327."
      quote:
        en: "She only listens. The ESP32 on the CAN bus doesn't even have a transmit path compiled in."
        cs: "Jen poslouchá. ESP32 na CAN sběrnici nemá ani zkompilovanou cestu k vysílání."
    dashcam:
      title:
        en: "The Camera That Never Sleeps"
        cs: "KAMERA, CO NESPÍ"
      description:
        en: "Your phone records the road on a loop, deletes old footage by itself and puts the important clips aside. When someone rear-ends you and then claims you reversed into them, you play it back to them."
        cs: "Telefon nahrává cestu pořád dokola, staré záznamy maže sám a ty důležité odloží stranou. Když ti někdo vletí do zadku a pak tvrdí, že jsi couval, pustíš mu to."
      quote:
        en: "Memory has holes. Video doesn't."
        cs: "Paměť je děravá. Video ne."
  features:
    realtime_surveillance_tracking:
      en: Real-Time Surveillance Tracking
      cs: Sledování v reálném čase
    voicetotext_transcription:
      en: Voice-to-Text Transcription
      cs: Přepis hlasu na text
    encrypted_evidence_storage:
      en: Encrypted Evidence Storage
