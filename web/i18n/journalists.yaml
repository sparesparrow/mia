    anonymous_operation_mode:
      en: Anonymous Operation Mode
      cs: Anonymní režim provozu
  stories:
    title:
      en: "Stories from the Front"
      cs: "PŘÍBĚHY Z FRONTY"
    gonzo_investigator:
      title:
        en: "Steering-Wheel Buttons"
        cs: "TLAČÍTKA NA VOLANTU"
      description:
        en: "MIA maps your steering-wheel buttons to any action you like: read out phone notifications when a message pings, start Waze navigation on a route with no cops, or send \"RDY\" to all your Signal contacts."
        cs: "MIA ti namapuje tlačítka na volantu na libovolné akce: Přečíst notifikace z telefonu, když ti cinkne zpráva, spustit navigaci přes Waze cestou, kde nejsou policajti, nebo napsat všem kontaktům na Signal \"RDY\"."
      features:
        - en: "Notifications read aloud"
          cs: "Notifikace nahlas"
        - en: "Waze without cops"
          cs: "Waze bez policajtů"
        - en: "Signal with one thumb"
          cs: "Signal jedním palcem"
    mobile_dj_revolution:
      title:
        en: "MIA in the Factory Speakers"
        cs: "MIA V TOVÁRNÍCH REPRÁCÍCH"
      description:
        en: "Your 2004 radio has no Bluetooth? No problem. MIA plugs into the CD changer connector, the radio thinks it's playing “CD 1”, and music, navigation and MIA all come out of the factory speakers. No cut wires, no new head unit. And the steering-wheel buttons send her commands."
        cs: "Rádio z roku 2004 neumí Bluetooth? Nevadí. MIA se připojí do konektoru pro CD měnič, rádio si myslí, že hraje „CD 1“, a z továrních repráků ti jde hudba, navigace i MIA. Bez řezání kabelů, bez nového rádia. A tlačítka na volantu jí k tomu posílají povely."
      features:
        - en: "CD changer connector"
          cs: "Konektor CD měniče"
        - en: "Factory speakers"
          cs: "Tovární repráky"
        - en: "No cutting"
          cs: "Žádné řezání"
  manifesto:
    title:
      en: "Digital Guerrilla Manifesto"
      cs: "MANIFESTÍ DIGITÁLNÍ GUERILLY"
    content:
      paragraph1:
        en: "Your car knows more about you than your mum does. How much you drive, where you park, how you brake. A new car sends that to the manufacturer and the insurer. MIA reads it for you alone."
        cs: "Tvoje auto o tobě ví víc než tvoje máma. Kolik jezdíš, kde stojíš, jak brzdíš. Nové auto to pošle výrobci a pojišťovně. MIA to čte jen pro tebe."
      paragraph2:
        en: "No cloud, no subscription. A Raspberry Pi under the seat, a couple of ESP32s behind the dash and a phone in the mount. The hardware is yours, the code is open, and nobody can switch it off remotely."
        cs: "Žádný cloud, žádné předplatné. Raspberry Pi pod sedačkou, pár ESP32 za palubkou a telefon v držáku. Hardware je tvůj, kód je otevřený a nikdo ti to na dálku nevypne."
      paragraph3:
        en: "She only listens to the car. She sends nothing on the bus and writes nothing to the control units. MIA can't kill your engine or unlock your doors, even if she wanted to."
        cs: "Do auta jen poslouchá. Na sběrnici nic neposílá, do řídicích jednotek nezapisuje. MIA ti nezhasne motor ani neodemkne dveře, ani kdyby chtěla."
      paragraph4:
        en: "Join us. Or keep driving a car that snitches on you instead of to you."
        cs: "Připoj se. Nebo dál jezdi v autě, které donáší na tebe, a ne tobě."
  cta:
    ready_to_investigate:
      en: "Want MIA in your car first?"
      cs: "Chceš MIA do auta jako první?"
    start_investigative_journalism:
      en: Start Investigative Journalism
      cs: Začít investigativní žurnalistiku
    book_surveillance_demo:
