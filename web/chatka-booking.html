<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatka Booking Simulation — MIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #010106;
    --surface: #0c0c18;
    --border: #1a2035;
    --cyan: #00e5ff;
    --green: #69ff47;
    --amber: #ffb300;
    --red: #ff1744;
    --muted: #3a4a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: #c8d8e8; font-family: 'Courier Prime', monospace;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* scanline overlay */
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px);
    animation: scanroll 8s linear infinite; }
  @keyframes scanroll { to { background-position: 0 100px; } }

  header { padding: 12px 20px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 14px; background: #080810; flex-shrink:0; }
  .logo { font-family: 'VT323', monospace; font-size: 1.4rem; color: var(--cyan);
          letter-spacing: 3px; }
  .logo span { color: var(--amber); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink:0; }
  .dot.running { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1.4s infinite; }
  .dot.stopped { background: var(--red); box-shadow: 0 0 6px var(--red88); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  #statusLabel { font-family:'VT323',monospace; font-size:1rem; color: var(--muted); }
  .back-link { margin-left:auto; font-size:.75rem; color:var(--muted); text-decoration:none; }
  .back-link:hover { color:var(--cyan); }

  .controls { padding: 10px 20px; display: flex; gap: 8px; align-items: center;
              border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink:0; }
  select { background: #0a0a14; color: #88a0b8; border: 1px solid var(--border);
           padding: 5px 10px; border-radius: 3px; font-family: 'VT323',monospace; font-size:1rem; cursor:pointer; }
  button { padding: 5px 16px; border: none; border-radius: 3px; cursor: pointer;
           font-family: 'VT323',monospace; font-size:1.1rem; letter-spacing:1px; transition: opacity .15s; }
  button:hover { opacity:.85; }
  button:disabled { opacity:.35; cursor:default; }
  #btnStart { background: var(--cyan); color: #000; }
  #btnStop  { background: var(--red);  color: #fff; }
  #btnClear { background: #181828; color: var(--muted); border:1px solid var(--border); }
  .turn-info { margin-left:auto; font-family:'VT323',monospace; font-size:1rem; color:var(--muted); min-width:140px; text-align:right; }

  .speaker-bar { height: 2px; flex-shrink:0; transition: background .08s; }
  .speaker-bar.caller { background: linear-gradient(90deg,var(--cyan),transparent 80%); }
  .speaker-bar.target { background: linear-gradient(90deg,var(--green),transparent 80%); }

  .transcript { flex:1; overflow-y:auto; padding: 12px 20px; display:flex; flex-direction:column; gap:4px; }
  .transcript::-webkit-scrollbar { width:4px; }
  .transcript::-webkit-scrollbar-thumb { background:var(--border); }

  .line { display:grid; grid-template-columns: 78px 1fr; gap:8px; font-size:.88rem;
          padding:5px 0; border-bottom:1px solid #0d0d1a; animation:fadein .18s ease; }
  @keyframes fadein { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
  .role { font-family:'VT323',monospace; font-size:.95rem; letter-spacing:1px; padding-top:1px; }
  .role.caller { color:var(--cyan); }
  .role.target { color:var(--green); }
  .role.sys    { color:var(--muted); }
  .text { line-height:1.5; }
  .text.caller { color:#b8e8f8; }
  .text.target { color:#c8f8c0; }
  .text.sys    { color:#3a4a5a; }

  footer { padding:6px 20px; border-top:1px solid var(--border); font-family:'VT323',monospace;
           font-size:.95rem; color:var(--muted); display:flex; gap:24px; background:#080810; flex-shrink:0; }
  footer span b { color:#557; }

  .conn-err { text-align:center; padding:8px; font-size:.75rem; color:var(--red); background:#1a0008;
              border-bottom:1px solid #330010; display:none; flex-shrink:0; }
</style>
</head>
<body>
<header>
  <span class="logo">MIA//<span>CHATKA</span></span>
  <div class="dot" id="dot"></div>
  <span id="statusLabel">OFFLINE</span>
  <a class="back-link" href="/">← MIA Dashboard</a>
</header>

<div class="controls">
  <select id="modeSelect">
    <option value="espeak">ESPEAK — zero cost</option>
    <option value="hybrid" selected>HYBRID — 1× ElevenLabs</option>
  </select>
  <button id="btnStart" onclick="start()">▶ START</button>
  <button id="btnStop"  onclick="stop()"  disabled>■ STOP</button>
  <button id="btnClear" onclick="clearLog()">✕ CLEAR</button>
  <span class="turn-info" id="turnInfo"></span>
</div>

<div class="speaker-bar" id="speakerBar"></div>
<div class="conn-err" id="connErr">Nelze se připojit k serveru (python server.py)</div>

<div class="transcript" id="transcript">
  <div class="line">
    <span class="role sys">SYS</span>
    <span class="text sys" id="bootMsg">Čekám na připojení …</span>
  </div>
</div>

<footer>
  <span>CALLER <b id="callerCount">0</b></span>
  <span>RECEPCE <b id="targetCount">0</b></span>
  <span id="modeLabel">—</span>
  <span id="connStatus" style="margin-left:auto">—</span>
</footer>

<script>
// Derive WebSocket URL from current location so the page works in any deployment.
// Override at runtime by setting window.MIA_CHATKA_WS_URL before this script runs,
// or via the ?ws= query parameter (e.g. ?ws=ws://demo.local:8432/ws).
const WS_URL = (function () {
  const override = (typeof window !== 'undefined') && (
    new URLSearchParams(window.location.search).get('ws') ||
    window.MIA_CHATKA_WS_URL
  );
  if (override) return override;
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  // Default port matches the chatka simulator (python server.py listens on 8432).
  const host = window.location.hostname || 'localhost';
  const port = window.location.port || '8432';
  return `${proto}//${host}:${port}/ws`;
})();
const bootMsgEl = document.getElementById('bootMsg');
if (bootMsgEl) bootMsgEl.textContent = `Čekám na připojení k ${WS_URL} …`;
let ws, callerN = 0, targetN = 0, running = false;

function connect() {
  document.getElementById('connErr').style.display = 'none';
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    addLine('sys', 'Připojeno k simulačnímu serveru.');
    document.getElementById('connStatus').textContent = 'CONNECTED';
    document.getElementById('btnStart').disabled = false;
  };

  ws.onmessage = e => handle(JSON.parse(e.data));

  ws.onclose = () => {
    setStatus('stopped');
    document.getElementById('connStatus').textContent = 'DISCONNECTED';
    document.getElementById('connErr').style.display = 'block';
    document.getElementById('btnStart').disabled = true;
    setTimeout(connect, 3000);
  };
}

function handle(msg) {
  switch (msg.type) {
    case 'status':
      running = msg.status === 'running';
      setStatus(msg.status);
      if (msg.mode) document.getElementById('modeLabel').textContent = msg.mode.toUpperCase();
      document.getElementById('btnStart').disabled = running;
      document.getElementById('btnStop').disabled  = !running;
      break;
    case 'line':
      addLine(msg.role, msg.text);
      break;
    case 'speaking':
      document.getElementById('speakerBar').className = 'speaker-bar ' + msg.who;
      document.getElementById('turnInfo').textContent =
        msg.who === 'caller' ? '▶ CALLER mluví' : '▶ RECEPCE mluví';
      break;
    case 'silent':
      document.getElementById('speakerBar').className = 'speaker-bar';
      document.getElementById('turnInfo').textContent = '';
      break;
    case 'error':
      addLine('sys', '⚠ ' + msg.text);
      break;
  }
}

function addLine(role, text) {
  const t = document.getElementById('transcript');
  const label = { caller:'▶ CALLER', target:'▶ RECEPCE', sys:'SYS' }[role] || role.toUpperCase();
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="role ${role}">${label}</span><span class="text ${role}">${text}</span>`;
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
  if (role === 'caller') document.getElementById('callerCount').textContent = ++callerN;
  if (role === 'target') document.getElementById('targetCount').textContent = ++targetN;
}

function setStatus(s) {
  document.getElementById('dot').className = 'dot ' + s;
  document.getElementById('statusLabel').textContent = s.toUpperCase();
}

function start() {
  callerN = targetN = 0;
  document.getElementById('callerCount').textContent = '0';
  document.getElementById('targetCount').textContent = '0';
  ws.send(JSON.stringify({ cmd: 'start', mode: document.getElementById('modeSelect').value }));
}

function stop()     { ws.send(JSON.stringify({ cmd: 'stop' })); }
function clearLog() { document.getElementById('transcript').innerHTML = ''; callerN = targetN = 0; }

connect();
</script>
</body>
</html>
