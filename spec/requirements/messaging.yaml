# Requirements registry: see spec/README.md for fields and evidence states.
area: messaging
title: Messaging and API gateway
description: ZeroMQ control plane, telemetry fan-out, REST/WebSocket gateway, sessions and device registry.
requirements:
- id: REQ-NET-001
  title: ZeroMQ control-plane broker
  statement: A ROUTER-DEALER broker on port 5555 shall register workers and route requests and responses between
    clients and workers.
  evidence: implemented_and_ci_tested
  acceptance:
  - A DEALER client reaches the broker in a hardware-free startup
  implemented_in:
  - apps/rpi-backend/shared/messaging/broker.py
  - apps/rpi-backend/py-api/core/messaging/client.py
  services:
  - zmq-broker
  decisions:
  - ADR-0003
  notes: apps/rpi-backend/py-api/core/messaging/broker.py duplicates the deployed broker; tracked as a follow-up.
- id: REQ-NET-002
  title: REST gateway
  statement: A FastAPI gateway on port 8000 shall expose device, GPIO, telemetry, LED and session endpoints with
    response shapes the Android client relies on.
  evidence: implemented_and_ci_tested
  acceptance:
  - /devices, /status, /telemetry, /command and /sessions keep the contracted response shapes
  - The API imports its generated bindings with the PYTHONPATH its systemd unit sets
  implemented_in:
  - apps/rpi-backend/py-api/api/main.py
  - apps/rpi-backend/py-api/api/server.py
  services:
  - mia-api
  decisions:
  - ADR-0005
- id: REQ-NET-003
  title: Real-time WebSocket telemetry
  statement: The gateway shall stream telemetry and LED state on /ws and /ws/telemetry at 10 Hz.
  evidence: implemented_and_ci_tested
  acceptance:
  - A /ws/telemetry message carries the telemetry cache, LED state and latest vehicle envelope
  implemented_in:
  - apps/rpi-backend/py-api/api/main.py
  services:
  - mia-api
  decisions:
  - ADR-0005
- id: REQ-NET-004
  title: BLE advertising
  statement: The Pi shall advertise itself over BLE as a MIA OBD-II adapter via BlueZ D-Bus.
  evidence: implemented_untested
  implemented_in:
  - apps/rpi-backend/py-api/services/ble_advertiser.py
  services:
  - mia-ble-advertiser
- id: REQ-NET-005
  title: BLE OBD GATT service
  statement: The Pi shall bridge Android OBD commands received over the Nordic UART Service to ZeroMQ.
  evidence: implemented_untested
  implemented_in:
  - apps/rpi-backend/py-api/services/ble_obd_service.py
  services:
  - mia-ble-obd
- id: REQ-NET-006
  title: Multi-client sessions
  statement: The gateway shall keep sessions for multiple clients and let a session move between clients through
    handoff tokens that expire after 5 minutes.
  evidence: implemented_and_ci_tested
  acceptance:
  - Sessions can be created, read, updated, handed off, resumed and deleted
  implemented_in:
  - apps/rpi-backend/py-api/api/sessions.py
  services:
  - mia-api
- id: REQ-NET-007
  title: Device registry
  statement: The gateway shall keep a persistent registry of devices with profiles, health state and auto-discovery.
  evidence: implemented_and_ci_tested
  acceptance:
  - Devices register, update health and persist across restarts
  implemented_in:
  - apps/rpi-backend/py-api/core/registry/device_registry.py
  - apps/rpi-backend/py-api/core/registry/device_profile.py
  services:
  - mia-api
  notes: apps/rpi-backend/shared/registry/ duplicates this code; tracked as a follow-up.
- id: REQ-NET-008
  title: Message envelope
  statement: Voice and console messages shall travel in one FlatBuffers envelope that routes by service type, carries a version and session, and nests a service payload.
  evidence: implemented_and_ci_tested
  acceptance:
  - Every voice command and event round-trips through the envelope, and the machine's feedback table is fully representable
  - A garbled buffer, a wrong version, an unknown service or an unopened session is answered with a status and never raises
  - The schema, the generated Python and C++ bindings, the enum-only header and the interface table agree, and CI compares them with a fresh flatc run
  - A console can send only the button commands and the verbosity setting; the channel, not the peer, sets the command source
  - Events go to every open session of the service and to no other
  - A session that opens receives the service's snapshot (the voice settings) on its own, right after the Ok to its Open
  implemented_in:
  - schemas/voice.fbs
  - apps/rpi-backend/py-api/services/voice_fsm/wire
  - apps/rpi-backend/py-api/api/voice_console.py
  - tools/schemas/extract_enums.py
  decisions:
  - ADR-0004
  - ADR-0013
  not_proven: Only in-process and loopback peers have exchanged envelopes in tests; the Android console decodes the shared
    fixtures in its unit tests but has not been connected to a Pi. No ESP32 firmware reads them, the console endpoint drives a
    simulated machine rather than the voice pipeline on the Pi (unless VOICE_CONSOLE_BACKEND=router, REQ-VOICE-024), and the numbers were not measured on a Pi.
- id: REQ-NET-009
  title: Abstract channel
  statement: Messages shall be sent and received through a channel interface with in-memory, stream (TCP and unix socket), UDP and WebSocket implementations, with length framing only on stream transports.
  evidence: implemented_and_ci_tested
  acceptance:
  - One write is one read on the other side for the in-memory, framed-stream and UDP channels
  - A framed channel reassembles a message that arrives in pieces, splits messages that arrive together, and drops a stream that announces an oversized frame
  - A closed or vanished peer ends a read with a closed error after the queued messages, and a write to a closed channel fails
  - A UDP channel ignores datagrams from any address but its peer's
  - A listener hands out one channel per TCP or unix-socket connection
  - The WebSocket endpoint refuses connections unless enabled, needs the API key when keys are configured, refuses text frames, and drops a console that stops reading instead of buffering without limit
  implemented_in:
  - apps/rpi-backend/py-api/services/voice_fsm/wire/channel.py
  - apps/rpi-backend/py-api/api/voice_console.py
  decisions:
  - ADR-0013
  not_proven: Run on loopback, socket pairs and a test client only. The stream and UDP channels do not authenticate their peers, a read-scope key is enough to press the console buttons, a slow TCP peer is dropped after a 2 s send timeout that was not tested under load, and nothing ran across a real network, the car's Wi-Fi or a serial line.
- id: REQ-NET-010
  title: Remaining voice transports
  statement: The voice envelope shall also be carried over ZeroMQ, BLE and a serial line, each behind the same channel interface.
  evidence: planned
  implemented_in: []
  decisions:
  - ADR-0013
  not_proven: Not yet implemented; a serial line is expected to be the framed stream channel over pyserial.
  notes: The loopback ZeroMQ hub of REQ-VOICE-024 carries the same envelope between the API and the voice router, but it is a relay for the console, not this requirement's channel implementation.
- id: REQ-NET-011
  title: LED commands over the telemetry WebSocket
  statement: The gateway shall apply the LED commands the Android app sends on /ws/telemetry (set_mode, set_ai_state,
    set_brightness, trigger_emergency, clear_emergency, start_animation, stop_animation) to the LED state and forward them
    to the LED controller, and shall ignore a command that is unknown or invalid.
  evidence: implemented_and_ci_tested
  acceptance:
  - A valid command changes the LED state that /led/state and the next /ws/telemetry message report
  - A brightness outside 0..255 is clamped, and an AI state, mode, animation or value of the wrong kind leaves the state unchanged
  - Text that is not a JSON object is ignored and the stream keeps running
  implemented_in:
  - apps/rpi-backend/py-api/api/main.py
  services:
  - mia-api
  not_proven: The LED controller (Arduino/ESP32 strip) was not driven; the commands were checked against the API state
    only. The Android LED tab has not been seen changing a real LED.
