# Requirements registry: see spec/README.md for fields and evidence states.
area: web
title: Web pages
description: Published static web surfaces.
requirements:
- id: REQ-WEB-001
  title: Generated segment landing pages
  statement: Customer-segment landing pages shall be generated from one template with Czech and English strings,
    and must not leak template placeholders.
  evidence: implemented_and_ci_tested
  acceptance:
  - Every customer segment is generated in Czech and English from the shared template
  - Generated pages contain no unresolved template placeholders
  implemented_in:
  - web/scripts/generatePages.js
  - web/template.html
  - web/i18n
  notes: Each page is rendered once per language (Czech at <segment>/, English at <segment>/en/), so the pages
    need no runtime i18n. web/scripts/build-smoke.js checks this, and the publish-pages workflow runs it through
    npm test; traceability counts that smoke test as CI evidence.
- id: REQ-WEB-002
  title: Audience routing and evidence-based marketing copy
  statement: The published site shall give each audience (business, families, musicians, journalists, developers,
    mechanics, testers, press) its own entry path, and shall publish no prices or performance figures that the
    requirement registry does not support.
  evidence: implemented_and_ci_tested
  acceptance:
  - Every published generated page links to every supported audience and its alternate language
  - Generated audience pages contain no unsupported prices, performance figures or retired AI-SERVIS branding
  implemented_in:
  - web/scripts/generatePages.js
  - web/i18n/site.yaml
  - web/index.html
  - web/404.html
  - docs/for
  - .github/workflows/publish-pages.yml
  decisions:
  - ADR-0010
  notes: web/scripts/build-smoke.js checks that every generated page links to every audience, and that it has no
    AI-SERVIS name, currency or the removed percentages. The "what works today" list in web/i18n/site.yaml, and
    a segment's own `site:` override of it (web/i18n/gonzo.yaml), must only name requirements that are
    implemented_and_ci_tested or better; planned features go in the use cases. The hand-written homepage
    (web/index.html) is not covered by the smoke test.
  not_proven: The hand-written homepage is outside the generated-page smoke test.
- id: REQ-WEB-003
  title: Homepage voice guides
  statement: The homepage shall offer three voice guides (Holly, Rimmer, Kryten) that tell a visitor what MIA is,
    how it works and what works today, through one embedded widget the visitor can switch between guides, and
    shall say on the page that the guides run in a third-party cloud while MIA itself does not.
  evidence: implemented_and_ci_tested
  acceptance:
  - The homepage has a crew section with one selectable card per guide, and each card maps to a distinct agent ID
  - The homepage loads the widget embed script and has a single mount point for the widget
  - The homepage states that the guides run through ElevenLabs in the cloud
  implemented_in:
  - web/index.html
  - web/customers/journalists/gonzo-styles.css
  decisions:
  - ADR-0010
  notes: The guides are ElevenLabs agents configured outside this repository. Their agent IDs are public by
    design; each agent only accepts the published site's origin and has a daily conversation limit. The guides
    answer from a fact sheet that follows the "what works today" rule of REQ-WEB-002. web/scripts/build-smoke.js
    checks the homepage markup.
  not_proven: The smoke test checks markup only. A live conversation, the widget rendering in a browser, and the
    guides' answers are not covered by CI.
  safety: Nothing here touches a vehicle or hardware. The guides have no tools beyond handing over to each other
    and ending the call.
