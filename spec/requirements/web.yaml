# Requirements registry: see spec/README.md for fields and evidence states.
area: web
title: Web pages
description: Published static web surfaces, and the web console the Pi serves itself.
requirements:
- id: REQ-WEB-001
  title: Generated segment landing pages
  statement: Customer-segment landing pages shall be generated from one template with Czech and English strings,
    and must not leak template placeholders.
  evidence: implemented_and_ci_tested
  acceptance:
  - Every customer segment is generated in Czech and English from the shared template
  - Generated pages contain no unresolved template placeholders
  implemented_in:
  - web/scripts/generatePages.js
  - web/template.html
  - web/i18n
  notes: Each page is rendered once per language (Czech at <segment>/, English at <segment>/en/), so the pages
    need no runtime i18n. web/scripts/build-smoke.js checks this, and the publish-pages workflow runs it through
    npm test; traceability counts that smoke test as CI evidence.
- id: REQ-WEB-002
  title: Audience routing and evidence-based marketing copy
  statement: The published site shall give each audience (business, families, musicians, journalists, developers,
    mechanics, testers, press) its own entry path, and shall publish no prices or performance figures that the
    requirement registry does not support.
  evidence: implemented_and_ci_tested
  acceptance:
  - Every published generated page links to every supported audience and its alternate language
  - Generated audience pages contain no unsupported prices, performance figures or retired AI-SERVIS branding
  - The hand-written homepage and 404 page pass the same price, figure and branding checks, and link to every
    audience page
  implemented_in:
  - web/scripts/generatePages.js
  - web/i18n/site.yaml
  - web/index.html
  - web/404.html
  - docs/for
  - .github/workflows/publish-pages.yml
  decisions:
  - ADR-0010
  notes: web/scripts/build-smoke.js checks that every generated page links to every audience, and that it has no
    AI-SERVIS name, currency or the removed percentages. The "what works today" list in web/i18n/site.yaml, and
    a segment's own `site:` override of it (web/i18n/gonzo.yaml), must only name requirements that are
    implemented_and_ci_tested or better; planned features go in the use cases. The smoke test applies the same
    name, currency and percentage checks to the hand-written web/index.html and web/404.html, checks that the
    homepage links to every audience, and that the 404 page links to the homepage and every audience page. The
    404 page links with /mia/ paths that its inline script rewrites to the host's base; the generated
    vercel.json also redirects /mia/... to the root, so the links work on the Vercel mirror without
    JavaScript. web/cypress/e2e/prod-smoke.cy.js checks both on the live hosts.
  not_proven: Free-text claims on the hand-written homepage (beyond prices, percentages and the old name) are
    reviewed by hand against the registry, not by CI. The Vercel redirect is checked by the read-only production
    smoke test, which is run by hand, not in CI.
- id: REQ-WEB-003
  title: Homepage voice guides
  statement: The homepage shall offer three voice guides (Holly, Rimmer, Kryten) that tell a visitor what MIA is,
    how it works and what works today, through one embedded widget the visitor can switch between guides, and
    shall say on the page that the guides run in a third-party cloud while MIA itself does not.
  evidence: implemented_and_ci_tested
  acceptance:
  - The homepage has a crew section with one selectable card per guide, and each card maps to a distinct agent ID
  - The homepage loads the widget embed script and has a single mount point for the widget
  - The homepage states that the guides run through ElevenLabs in the cloud
  implemented_in:
  - web/index.html
  - web/customers/journalists/gonzo-styles.css
  decisions:
  - ADR-0010
  notes: The guides are ElevenLabs agents configured outside this repository. Their agent IDs are public by
    design; each agent only accepts the published site's origin and has a daily conversation limit. Holly routes
    the visitor to Rimmer (features and requirements) or Kryten (architecture and code). Both answer from a fact
    sheet that follows the "what works today" rule of REQ-WEB-002, plus copies of this registry, the published
    docs and selected source files that ElevenLabs refreshes from the main branch. web/scripts/build-smoke.js
    checks the homepage markup.
  not_proven: In CI, the smoke test checks the markup and web/cypress/e2e/homepage.cy.js checks in a browser that
    each guide card swaps the widget to a distinct agent, with the ElevenLabs script stubbed. A live conversation,
    the real widget rendering and the guides' answers are not covered by CI.
  safety: Nothing here touches a vehicle or hardware. The guides can only hand over to each other, switch
    language, end the call and read their knowledge base.
- id: REQ-WEB-004
  title: Accessible and indexable page structure
  statement: Every published page (the generated audience pages, the press kit and the homepage) shall start
    with a skip link to a single main landmark, have exactly one top-level heading and carry Open Graph tags, and
    the site shall publish robots.txt and a sitemap that lists every page in both languages.
  evidence: implemented_and_ci_tested
  acceptance:
  - "Every generated page and the homepage has one <main id=\"main\">, exactly one <h1> and a skip link to the
    main landmark as its first link"
  - Every generated page and the homepage has og:title, og:description, og:url and an og:image that exists in the
    published assets
  - The homepage lazy-loads every image below the hero
  - robots.txt points to sitemap.xml, which lists the homepage and every generated page in Czech and English
  - Text over a solid background on every published page, and in the open mobile menu, meets WCAG 2.2 AA
    contrast (4.5:1, or 3:1 for large text)
  implemented_in:
  - web/template.html
  - web/press-template.html
  - web/index.html
  - web/scripts/generatePages.js
  - web/i18n/site.yaml
  - web/site.css
  - web/customers/journalists/gonzo-styles.css
  - web/customers/business/styles.css
  - web/customers/journalists/styles.css
  - web/customers/musicians/styles.css
  decisions:
  - ADR-0027
  notes: web/scripts/build-smoke.js checks the markup, robots.txt and sitemap.xml in CI. The sitemap and canonical
    URLs use the primary host mia-suzmatra.vercel.app (ADR-0027); the GitHub Pages mirror serves the same gh-pages
    files. robots.txt only takes effect at a host root, so on the GitHub Pages mirror it is informational, and the
    sitemap has to be submitted to search engines directly.
  not_proven: The smoke test checks markup; web/cypress/e2e/structure.cy.js also checks in a browser that the
    skip link shows when focused and that every page fits a 390 px screen, and web/cypress/e2e/contrast.cy.js
    checks text contrast over solid backgrounds. Contrast of text over gradients and images (the homepage's red
    gradient tags and buttons, the segment hero and call-to-action sections), screen-reader output, the full
    focus order and the 24 px target size are checked by hand, not in CI.
  safety: n/a. Static pages only; nothing touches a vehicle or hardware.
- id: REQ-WEB-005
  title: Security headers on the Vercel mirror
  statement: The Vercel mirror of the site shall send nosniff, referrer, framing and permissions headers, and a
    report-only Content-Security-Policy that names every host the pages load from and the hash of every inline
    script.
  evidence: implemented_and_ci_tested
  acceptance:
  - dist/vercel.json sets X-Content-Type-Options nosniff, a Referrer-Policy, X-Frame-Options SAMEORIGIN and an
    enforced frame-ancestors 'self' policy for every path
  - The Permissions-Policy does not restrict the microphone the voice guides need
  - The report-only Content-Security-Policy contains the sha256 of every inline script in the generated pages,
    the homepage and 404.html
  implemented_in:
  - web/scripts/generatePages.js
  decisions:
  - ADR-0010
  notes: Vercel project citadela-resort/mia-suzmatra deploys the gh-pages branch, whose root is web/dist/ plus the
    homepage, so the generated dist/vercel.json lands at the deployment root. GitHub Pages cannot send custom
    headers and ignores the file. The full policy stays report-only until a complete voice-guide conversation has
    been tested under it; MkDocs pages under docs/ are excluded from it. web/scripts/build-smoke.js checks the file.
  not_proven: CI checks the generated file, not the live response headers, and no voice conversation has been run
    under the policy.
  safety: n/a. Static pages only; nothing touches a vehicle or hardware.
- id: REQ-WEB-006
  title: Pi web console for configuration and a live view
  statement: The Pi shall serve a web console at /console/ that shows its status, its telemetry and the voice
    machine live, and changes the voice and audio settings, so MIA can be configured and watched without the
    Android app. The console shall send nothing to the vehicle, and shall be served only to the Pi itself, or
    to its local network once an API key is configured.
  evidence: implemented_and_ci_tested
  acceptance:
  - /console/ serves one static page with a Content-Security-Policy that allows only the Pi's own origin and no
    inline script, and the page loads nothing from another host
  - The page script names only /auth/status, /status, /telemetry, /audio/settings, /console/voice/events and
    /console/voice/settings, and no vehicle, GPIO, LED, OTA or registry route
  - With no API key configured, only a loopback client whose Host header names loopback is served; with a key, a
    client on a private, link-local or unique-local address is served too; a public address never is
  - Off with MIA_WEB_CONSOLE=0 (404 on every console route)
  - /console/voice/events streams the voice machine as JSON lines (hello, the settings snapshot, then state,
    feedback, speak, transcript and settings events) without sending the machine a command, from the simulated
    backend and from the voice router over ZeroMQ; it ends with an unavailable line when the console is off or
    the router goes silent
  - /console/voice/settings needs the write scope, sends only SetVerbosity, SwitchPersona and SetLanguage, refuses
    a value that cannot be a setting with 422, and the change is stored and seen by every watcher
  implemented_in:
  - apps/rpi-backend/py-api/api/web_console.py
  - apps/rpi-backend/py-api/api/console
  - apps/rpi-backend/py-api/api/auth/dependencies.py
  services:
  - mia-api
  decisions:
  - ADR-0029
  notes: The page is plain HTML, CSS and JavaScript in apps/rpi-backend/py-api/api/console/, served by mia-api, so it
    ships with the backend and needs no build step and no internet. The key the user types stays in the tab's
    sessionStorage and travels only in the X-API-Key header. Audio settings reuse GET and PUT /audio/settings
    (REQ-VOICE-030). The voice routes need VOICE_CONSOLE=1, like /ws/voice. tests/unit/rpi_backend/test_web_console.py
    covers the gate, the headers, the page's API paths, both voice backends and the settings.
  not_proven: The page has not been opened in a browser on a real Pi or in the car; CI checks the page's source and
    the routes, not how it renders. The agent-handoff view and the onboarding steps (issue 330) are not part of
    it yet. Nothing limits how many streams one client opens.
  safety: Read-only toward the vehicle. The console's own routes reach only the voice machine's settings commands,
    and the page calls no route that drives a bus, a pin or the LEDs. The routes it reads (/status, /telemetry) keep
    the API's own authentication.
