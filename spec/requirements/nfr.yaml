# Requirements registry: see spec/README.md for fields and evidence states.
area: nfr
title: Non-functional requirements
description: Cross-cutting constraints every component must meet.
requirements:
- id: REQ-NFR-001
  title: Simulation fallback
  statement: Every hardware-dependent component shall fall back to a simulation when its hardware is absent, so
    it runs in CI and on non-Pi machines.
  evidence: implemented_and_ci_tested
  acceptance:
  - GPIO, Arduino and the hardware manager work with no hardware attached
  implemented_in:
  - apps/rpi-backend/py-api/hardware/gpio.py
  - apps/rpi-backend/py-api/hardware/arduino.py
  - apps/rpi-backend/py-api/hardware/hardware_manager.py
  - apps/rpi-backend/py-api/hardware/serial_bridge.py
  decisions:
  - ADR-0007
- id: REQ-NFR-002
  title: Passive vehicle access by default
  statement: MIA shall not transmit on a vehicle bus, run active diagnostics or actuate anything unless that capability
    is explicitly enabled for a specific install.
  evidence: implemented_and_ci_tested
  acceptance:
  - The listen-only firmware cannot transmit
  - UDS is disabled by default in the VAG bridge unit
  implemented_in:
  - apps/esp32/firmware-obd/components/ai_servis_obd/ai_servis_obd.c
  - orchestration/mcp/modules/vag-audi-bridge/main.py
  - infra/systemd/mia-vag-audi-bridge.service
  decisions:
  - ADR-0006
  safety: Physical TXD disconnection on the car build remains required; software cannot prove it
- id: REQ-NFR-003
  title: Structured errors
  statement: Service and API error results shall be structured objects with status and message keys.
  evidence: implemented_untested
  implemented_in:
  - apps/rpi-backend/py-api/api/main.py
  - orchestration/mcp/modules/shared/mcp_framework.py
  notes: A project convention (CLAUDE.md); no test enforces it yet.
- id: REQ-NFR-004
  title: Evidence-based status
  statement: 'No requirement shall claim more evidence than exists: automated states need passing linked tests,
    and bench, hardware or vehicle states need a recorded evidence file.'
  evidence: planned
  implemented_in:
  - spec/requirements
  decisions:
  - ADR-0010
  notes: Enforced by the traceability check added with the test component.
