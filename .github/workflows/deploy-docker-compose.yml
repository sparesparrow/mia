name: Deploy Script & Docker Compose Validation

on:
  workflow_dispatch:
    inputs:
      run_docker_config:
        description: "Validate docker-compose configurations"
        type: boolean
        default: true
      run_sparetools_setup:
        description: "Run SpareTools (Conan) setup"
        type: boolean
        default: true
      run_deploy_help:
        description: "Smoke-test deploy-complete-system.sh (--help only)"
        type: boolean
        default: true
  push:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.11"
  CONAN_VERSION: "2.*"

jobs:
  deploy-script-and-docker-compose:
    name: Deploy Script & Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Conan (SpareTools dependency)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sparetools_setup || github.event_name != 'workflow_dispatch' }}
        run: |
          pip install "conan==${{ env.CONAN_VERSION }}"
          conan --version

      - name: Run SpareTools setup (Conan + zipapps)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sparetools_setup || github.event_name != 'workflow_dispatch' }}
        run: |
          chmod +x scripts/setup-sparetools.sh
          # Base SpareTools setup (Conan virtual env, remotes, etc.)
          bash scripts/setup-sparetools.sh

      - name: Smoke-test deploy-complete-system.sh (--help only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deploy_help || github.event_name != 'workflow_dispatch' }}
        run: |
          chmod +x scripts/deploy-complete-system.sh
          # --help exits before Raspberry Pi / root checks, safe in CI
          bash scripts/deploy-complete-system.sh --help

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate root docker-compose.yml
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_config || github.event_name != 'workflow_dispatch' }}
        run: |
          docker compose -f docker-compose.yml config

      - name: Validate dev docker-compose
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_config || github.event_name != 'workflow_dispatch' }}
        run: |
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml config
          fi

      - name: Validate Pi simulation docker-compose
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_config || github.event_name != 'workflow_dispatch' }}
        run: |
          if [ -f docker-compose.pi-simulation.yml ]; then
            docker compose -f docker-compose.pi-simulation.yml config
          fi

      - name: Validate edge pi-gateway docker-compose
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_config || github.event_name != 'workflow_dispatch' }}
        run: |
          if [ -f edge-compat/pi-gateway/docker-compose.yml ]; then
            docker compose -f edge-compat/pi-gateway/docker-compose.yml config
          fi

