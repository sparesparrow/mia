name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v2.0.0)'
        required: false
        type: string
      draft:
        description: 'Publish the release as a draft'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            ref="${{ inputs.tag }}"
          else
            ref="${GITHUB_SHA}"
          fi
          version="${ref#refs/tags/}"
          version="${version#v}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building release artifacts for ${ref} (version ${version})"

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APKs
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Stage APKs
        run: |
          mkdir -p dist/android
          find apps/android -path '*/build/outputs/apk/*' -name '*.apk' \
            -exec cp -v {} dist/android/ \;
          ls -la dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: mia-android-apk
          path: dist/android/
          if-no-files-found: error
          retention-days: 90

  cpp:
    name: C++ Binaries (linux-x86_64)
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            flatbuffers-compiler libflatbuffers-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libjsoncpp-dev libasound2-dev
      - name: Configure
        run: >
          cmake -S apps/rpi-backend/cpp-audio -B build/cpp -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWITH_HARDWARE=OFF
      - name: Build
        run: cmake --build build/cpp -j"$(nproc)"
      - name: Stage binaries
        run: |
          mkdir -p dist/cpp
          find build/cpp -maxdepth 2 -type f \
            \( -perm -111 -o -name '*.a' -o -name '*.so' \) \
            ! -name '*.cmake' ! -name '*.ninja' \
            -exec cp -v {} dist/cpp/ \; || true
          ls -la dist/cpp
      - uses: actions/upload-artifact@v4
        with:
          name: mia-cpp-linux-x86_64
          path: dist/cpp/
          if-no-files-found: error
          retention-days: 90

  esp32:
    name: ESP32 Firmware
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('apps/esp32/platformio.ini') }}
      - name: Build firmware
        run: |
          python -m pip install --upgrade pip platformio
          cd apps/esp32
          pio run
      - name: Stage firmware
        run: |
          mkdir -p dist/esp32
          find apps/esp32/.pio/build -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.hex' \) \
            -exec cp -v {} dist/esp32/ \;
          ls -la dist/esp32
      - uses: actions/upload-artifact@v4
        with:
          name: mia-esp32-firmware
          path: dist/esp32/
          if-no-files-found: error
          retention-days: 90

  backend:
    name: Raspberry Pi Backend Bundle
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Verify backend imports
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m compileall -q apps/rpi-backend orchestration Mia
      - name: Build deployment bundle
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p dist
          tar --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pio' \
              -czf "dist/mia-rpi-backend-${VERSION}.tar.gz" \
              apps/rpi-backend \
              orchestration \
              Mia \
              schemas \
              contracts \
              infra/systemd \
              infra/deploy \
              requirements.txt \
              requirements-ci.txt \
              VERSION.txt
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mia-rpi-backend-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [metadata, android, cpp, esp32, backend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package artifacts for release
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob

          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            # Loose files (already-archived bundles) are published as-is.
            case "$name" in
              mia-rpi-backend-bundle)
                cp -v "$dir"*.tar.gz release/
                ;;
              *)
                (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/${name}-${VERSION}.zip" .)
                ;;
            esac
          done

          if [ -z "$(ls -A release)" ]; then
            echo "::error::No build artifacts were produced; refusing to publish an empty release."
            exit 1
          fi

          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.ref }}
          name: MIA ${{ needs.metadata.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
