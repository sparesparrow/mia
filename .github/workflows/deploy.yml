name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate, do not build images'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - '.github/workflows/deploy.yml'
              - 'containers/**'
              - 'docker-compose.pi-simulation.yml'
              - 'infra/**'
              - 'orchestrator-config.yaml'
              - 'scripts/deploy*.sh'
              - 'scripts/ensure-bundled-cpython.sh'

  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.deploy == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose files
        run: |
          for f in infra/docker/docker-compose.yml infra/docker/docker-compose.dev.yml infra/docker/docker-compose.monitoring.yml docker-compose.pi-simulation.yml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose -f "$f" config > /dev/null
              echo "  OK"
            fi
          done
      - name: Validate deploy scripts
        run: |
          shopt -s nullglob
          candidates=(
            infra/deploy/rpi/deploy.sh
            scripts/ensure-bundled-cpython.sh
            scripts/deploy*.sh
          )
          for script in "${candidates[@]}"; do
            bash -n "$script"
            echo "$script: syntax OK"
          done

  docker-build:
    name: Compose Smoke Build
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: >
      !inputs.validate_only &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build deploy compose services
        run: |
          if [ -f infra/docker/docker-compose.yml ]; then
            docker compose -f infra/docker/docker-compose.yml build
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
