name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate, do not build images'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose files
        run: |
          for f in docker-compose.yml docker-compose.dev.yml docker-compose.pi-simulation.yml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose -f "$f" config > /dev/null && echo "  OK" || echo "  WARN: $f has issues"
            fi
          done
      - name: Validate deploy scripts
        run: |
          for script in scripts/deploy-complete-system.sh scripts/deploy-raspberry-pi.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" && echo "$script: syntax OK"
            fi
          done

  docker-build:
    name: Docker Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: validate
    if: >
      !inputs.validate_only &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        continue-on-error: true
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose build || echo "Docker build completed with warnings"
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
