name: Android Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/android/**'
      - 'contracts/**'
      - '.claude/skills/android-adb-test/**'
      - 'tools/scripts/test-orchestrator.sh'
      - '.github/workflows/android-test.yml'
  pull_request:
    branches: [main, develop, 'roadmap/**']
    paths:
      - 'apps/android/**'
      - 'contracts/**'
      - '.claude/skills/android-adb-test/**'
      - 'tools/scripts/test-orchestrator.sh'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # the SDK repository no longer serves, so sdkmanager exits 1.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run lint checks
        continue-on-error: true
        run: |
          cd apps/android
          ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        continue-on-error: true
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Validate APK
        run: |
          cd apps/android
          set -o pipefail
          bash ../../.claude/skills/android-adb-test/scripts/android-adb-test.sh build 2>&1 | tail -20

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [dashboard, ble-scan, obd-pairing, settings, full-flow]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # the SDK repository no longer serves, so sdkmanager exits 1.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/

      # Hosted Linux runners expose /dev/kvm but only to root; open it up so
      # the emulator runs hardware-accelerated instead of fully emulated
      # (which took ~4 min to boot and ~15 s per `uiautomator dump`).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          # android-emulator-runner runs every line of `script` as a separate
          # `sh -c`, so a command must not be split with backslashes: the
          # first line then passes a literal "\" and the rest never runs.
          # `test` does not install the app, so deploy the downloaded APK first.
          script: |
            bash "$GITHUB_WORKSPACE/.claude/skills/android-adb-test/scripts/android-adb-test.sh" deploy --device emulator-5554
            bash "$GITHUB_WORKSPACE/.claude/skills/android-adb-test/scripts/android-adb-test.sh" test --scenario ${{ matrix.scenario }} --screenshots --logs --device emulator-5554

      - name: Parse Test Results
        if: always()
        run: |
          if [ -d apps/android/test-artifacts ]; then
            LATEST=$(ls -t apps/android/test-artifacts | head -1)
            if [ -n "$LATEST" ] && [ -f "apps/android/test-artifacts/$LATEST/reports/test-report.json" ]; then
              echo "Test scenario: ${{ matrix.scenario }}"
              jq . "apps/android/test-artifacts/$LATEST/reports/test-report.json"
            fi
          fi

      - name: Capture Scenario Status
        if: always()
        run: |
          mkdir -p apps/android/test-artifacts
          echo "${{ job.status }}" > apps/android/test-artifacts/status.txt

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.scenario }}
          path: apps/android/test-artifacts/

  post-results:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: read
      issues: write
      # The summary is a comment on the PR; the API answered 403 with only issues: write.
      pull-requests: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate Report
        run: |
          echo "# 📱 Android Test Results" > test-summary.md
          echo "" >> test-summary.md
          echo "| Scenario | Status |" >> test-summary.md
          echo "|----------|--------|" >> test-summary.md

          for scenario in dashboard ble-scan obd-pairing settings full-flow; do
            status_file="test-results/test-artifacts-$scenario/status.txt"
            if [ -f "$status_file" ]; then
              status=$(cat "$status_file")
            else
              status="missing"
            fi

            case "$status" in
              success)
                label="✅ PASS"
                ;;
              failure)
                label="❌ FAIL"
                ;;
              cancelled)
                label="⚪ CANCELLED"
                ;;
              *)
                label="⚠️ ${status^^}"
                ;;
            esac

            echo "| \`$scenario\` | $label |" >> test-summary.md
          done

          echo "" >> test-summary.md
          echo "**Artifacts**: [Available in Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> test-summary.md

          cat test-summary.md

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- mia-android-test-summary -->';
            const body = `${marker}\n${fs.readFileSync('test-summary.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Notify Slack
        if: failure() && github.event_name == 'push'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ MIA Android Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*MIA Android Tests Failed*\n${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
