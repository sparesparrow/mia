name: Publish Web Pages

'on':
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'web/**'
      - '.github/workflows/publish-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'web/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build MkDocs Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Install MkDocs dependencies
        run: |
          pip install \
            mkdocs==1.5.3 \
            mkdocs-material==9.5.3 \
            mkdocs-mermaid2-plugin \
            pymdown-extensions

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir _site_docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site_docs/
          retention-days: 1

  build-web:
    name: Build Web Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Generate customer pages
        working-directory: web
        run: npm run build

      - name: Assemble static site
        run: |
          mkdir -p _site_web

          cp web/index.html _site_web/
          cp web/404.html _site_web/ 2>/dev/null || true
          cp web/styles.css _site_web/ 2>/dev/null || true
          cp web/gonzo-styles.css _site_web/ 2>/dev/null || true
          cp web/app.js _site_web/ 2>/dev/null || true

          cp -r web/agents _site_web/agents
          cp -r web/team _site_web/team
          cp -r web/js _site_web/js
          cp -r web/css _site_web/css
          cp -r web/assets _site_web/assets
          cp -r web/i18n _site_web/i18n

          if [ -d web/dist ]; then
            mkdir -p _site_web/customers
            cp -r web/dist/* _site_web/customers/
          fi

          touch _site_web/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: _site_web/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-docs, build-web]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: _merged/docs

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: _merged

      - name: Verify merged layout
        run: |
          echo "=== Site layout ==="
          find _merged -maxdepth 3 -type f | sort | head -60
          echo "=== Root files ==="
          ls -la _merged/

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _merged/
          force_orphan: true

  build-check:
    name: Build Check (PR)
    runs-on: ubuntu-latest
    needs: [build-docs, build-web]
    if: github.event_name == 'pull_request'
    steps:
      - run: echo "Both docs and web builds succeeded. Ready to merge."