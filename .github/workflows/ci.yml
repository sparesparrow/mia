name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci.yml'
      - '.tool-versions'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'agents/**'
      - 'apps/esp32/**'
      - 'apps/rpi-backend/**'
      - 'infra/conan/**'
      - 'apps/rpi-backend/cpp-mcp-bridge/**'
      - 'orchestration/**'
      - 'schemas/**'
      - 'tools/scripts/**'
      - 'tests/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.tool-versions'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'agents/**'
      - 'apps/esp32/**'
      - 'apps/rpi-backend/**'
      - 'infra/conan/**'
      - 'apps/rpi-backend/cpp-mcp-bridge/**'
      - 'orchestration/**'
      - 'schemas/**'
      - 'tools/scripts/**'
      - 'tests/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      schema: ${{ steps.filter.outputs.schema }}
      cpp: ${{ steps.filter.outputs.cpp }}
      esp32: ${{ steps.filter.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'pytest.ini'
              - 'requirements*.txt'
              - 'agents/**'
              - 'apps/rpi-backend/py-api/**'
              - 'apps/rpi-backend/shared/**'
              - 'orchestration/**'
              - 'schemas/**'
              - 'tools/scripts/**'
              - 'tests/**'
              - 'tools/**'
            schema:
              - '.github/workflows/ci.yml'
              - 'apps/rpi-backend/cpp-audio/core/webgrab.fbs'
              - 'schemas/**'
              - 'schemas/generate.py'
              - 'tools/scripts/generate-schemas.sh'
            cpp:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'apps/rpi-backend/cpp-audio/**'
              - 'infra/conan/**'
              - 'apps/rpi-backend/cpp-mcp-bridge/**'
              - 'schemas/generated/cpp/**'
            esp32:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'apps/esp32/**'

  schema-validation:
    if: needs.changes.outputs.schema == 'true'
    name: Schema Validation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install flatc
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Validate schemas compile
        run: |
          mkdir -p /tmp/fb-validate
          flatc --python -o /tmp/fb-validate schemas/vehicle_telemetry.fbs schemas/mia.fbs
          flatc --python -o /tmp/fb-validate schemas/vehicle_telemetry.fbs schemas/vehicle.fbs
          flatc --cpp --gen-mutable --scoped-enums -o /tmp/fb-validate apps/rpi-backend/cpp-audio/core/webgrab.fbs
      - name: Detect schema drift
        run: |
          mkdir -p /tmp/fb-drift
          flatc --python -o /tmp/fb-drift schemas/vehicle_telemetry.fbs schemas/mia.fbs
          drifted=0
          for gen in /tmp/fb-drift/Mia/*.py; do
            fname=$(basename "$gen")
            committed="schemas/generated/python/Mia/$fname"
            if [ -f "$committed" ]; then
              if ! diff -q "$gen" "$committed" > /dev/null 2>&1; then
                echo "DRIFT: $committed differs from regenerated output"
                diff --unified "$committed" "$gen" || true
                drifted=1
              fi
            else
              echo "NEW: $fname generated but not committed"
              drifted=1
            fi
          done
          if [ "$drifted" -eq 1 ]; then
            echo "::warning::Schema drift detected — run 'python schemas/generate.py --all' and commit the result"
          fi
      - name: Check schema and contract coordination
        if: github.event_name == 'pull_request'
        run: |
          # If schemas changed, check that contracts are also updated (or at least reviewed)
          schema_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- schemas/ | wc -l)
          contract_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- contracts/ | wc -l)
          if [ "$schema_changed" -gt 0 ] && [ "$contract_changed" -eq 0 ]; then
            echo "::warning::Schema files changed but contracts/ was not updated. Verify that contracts/events.md and contracts/topics.md still match."
          fi

  lint:
    if: needs.changes.outputs.python == 'true'
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8 black isort
      - name: flake8
        continue-on-error: true
        run: >
          flake8 orchestration/ tests/ apps/rpi-backend/ agents/ tools/
          --max-line-length=120
          --extend-ignore=E203,W503,W293,W291,E402,E302,E305,E501
          --per-file-ignores='tests/*:F401,F811'
          --exclude=__pycache__,*.pyc
          --count
      - name: black --check
        run: >
          black --check --line-length 120
          --exclude '/(\.git|\.venv|venv|build|apps/android|apps/esp32|schemas/generated|web|\.backups|exported-assets)/'
          .
        continue-on-error: true
      - name: isort --check
        run: isort --check --profile black --skip .venv --skip venv --skip apps/android --skip web .
        continue-on-error: true

  python-test:
    if: needs.changes.outputs.python == 'true'
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82" wheel
          python -m pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -m "not hardware" --tb=short -q

  cycle1-replay:
    if: needs.changes.outputs.python == 'true'
    name: Cycle 1 Passive Telemetry Replay
    runs-on: ubuntu-latest
    needs: [changes, lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml
      - name: Replay canonical vector
        run: |
          python tools/vehicle-replay/replay.py \
            --input tests/fixtures/cycle1_bench.jsonl \
            --device-id cycle1-ci \
            --source replay.can \
            --confidence 1.0 \
            --expect-complete > /tmp/cycle1-envelope.jsonl
          test -s /tmp/cycle1-envelope.jsonl
      - name: Validate canonical envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/vehicle_telemetry_envelope.schema.json").read_text())
          envelope = json.loads(Path("/tmp/cycle1-envelope.jsonl").read_text().splitlines()[-1])
          Draft202012Validator(schema).validate(envelope)
          assert envelope["signals"]["ignition"]["value"] is True
          assert envelope["signals"]["battery_voltage"]["value"] == 13.8
          assert envelope["signals"]["engine_rpm"]["value"] == 1750.0
          assert envelope["signals"]["coolant_temp_c"]["value"] == 86.0
          PY

  cpp-build:
    if: needs.changes.outputs.cpp == 'true'
    name: C++ Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -o pipefail
          run_step() {
            local label="$1"; shift
            if ! "$@" 2>&1 | tee /tmp/step.log; then
              echo "::error::${label} failed: $(tail -n 25 /tmp/step.log | tr '\n' '~')"
              return 1
            fi
          }
          run_step "apt-get update" sudo apt-get update
          run_step "apt-get install" sudo apt-get install -y \
            cmake ninja-build pkg-config \
            flatbuffers-compiler libflatbuffers-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libjsoncpp-dev libasound2-dev libmosquitto-dev
      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S apps/rpi-backend/cpp-audio -B build/cpp -G Ninja \
               -DCMAKE_BUILD_TYPE=Release -DWITH_HARDWARE=OFF 2>&1 | tee /tmp/configure.log; then
            echo "::error::CMake configure failed: $(tail -n 30 /tmp/configure.log | tr '\n' '~')"
            exit 1
          fi
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build/cpp -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "::error::Compilation failed: $(grep -E 'error:' /tmp/build.log | head -n 15 | tr '\n' '~')"
            exit 1
          fi
      - name: Stage binaries
        run: |
          mkdir -p dist/cpp
          find build/cpp -maxdepth 2 -type f \
            \( -perm -111 -o -name '*.a' -o -name '*.so' \) \
            ! -name '*.cmake' ! -name '*.ninja' \
            -exec cp -v {} dist/cpp/ \; || true
          ls -la dist/cpp
      - name: Upload C++ binaries
        uses: actions/upload-artifact@v4
        with:
          name: mia-cpp-linux-${{ matrix.arch }}
          path: dist/cpp/
          if-no-files-found: warn
          retention-days: 30

  esp32-build:
    if: needs.changes.outputs.esp32 == 'true'
    name: ESP32 Build
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Check for PlatformIO config
        id: check
        run: |
          if [ -f apps/esp32/platformio.ini ]; then
            echo "has_pio=true" >> $GITHUB_OUTPUT
          else
            echo "has_pio=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/cache@v4
        if: steps.check.outputs.has_pio == 'true'
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('apps/esp32/platformio.ini') }}
      - name: Build with PlatformIO
        if: steps.check.outputs.has_pio == 'true'
        run: |
          set -o pipefail
          python -m pip install --upgrade pip platformio
          cd apps/esp32
          if ! pio run 2>&1 | tee /tmp/pio.log; then
            echo "::error::PlatformIO build failed: $(grep -iE 'error|fatal' /tmp/pio.log | head -n 15 | tr '\n' '~')"
            exit 1
          fi
      - name: Stage firmware
        if: steps.check.outputs.has_pio == 'true'
        run: |
          mkdir -p dist/esp32
          find apps/esp32/.pio/build -type f \
            \( -name '*.bin' -o -name '*.elf' -o -name '*.hex' \) \
            -exec cp -v {} dist/esp32/ \; || true
          ls -la dist/esp32
      - name: Upload ESP32 firmware
        if: steps.check.outputs.has_pio == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mia-esp32-firmware
          path: dist/esp32/
          if-no-files-found: warn
          retention-days: 30

  esp32-obd-build:
    if: needs.changes.outputs.esp32 == 'true'
    name: ESP32 OBD Firmware Build
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # apps/esp32/firmware-obd is a plain ESP-IDF project, so the PlatformIO
      # job above never touches it. Without this job its sources are shipped
      # unbuilt.
      # The nm checks prove the passive build contains no CAN transmit path:
      # the default image must link twai_transmit (so the check matches the
      # real symbol name) and the listen-only image must not.
      - name: Build default configuration
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: apps/esp32/firmware-obd
          command: idf.py build && xtensa-esp32-elf-nm build/ai-servis-obd.elf | grep -qw twai_transmit
      - name: Build listen-only configuration
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
          path: apps/esp32/firmware-obd
          command: idf.py build -DMIA_TWAI_LISTEN_ONLY=1 && xtensa-esp32-elf-nm build/ai-servis-obd.elf > build/listen-only-symbols.txt && test -s build/listen-only-symbols.txt && ! grep -qw twai_transmit build/listen-only-symbols.txt
      - name: Stage firmware
        run: |
          mkdir -p dist/esp32-obd
          find apps/esp32/firmware-obd/build -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.elf' \) \
            -exec cp -v {} dist/esp32-obd/ \; || true
          ls -la dist/esp32-obd
      - name: Upload OBD firmware
        uses: actions/upload-artifact@v4
        with:
          name: mia-esp32-obd-firmware
          path: dist/esp32-obd/
          if-no-files-found: warn
          retention-days: 30
