name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/ci.yml'
      - '.tool-versions'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'agents/**'
      - 'apps/esp32/**'
      - 'apps/rpi-backend/**'
      - 'conan-recipes/**'
      - 'infra/conan/**'
      - 'Mia/**'
      - 'mcp-cpp-bridge/**'
      - 'modules/**'
      - 'orchestration/**'
      - 'platforms/**'
      - 'rpi/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'services/**'
      - 'tests/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.tool-versions'
      - 'pytest.ini'
      - 'requirements*.txt'
      - 'agents/**'
      - 'apps/esp32/**'
      - 'apps/rpi-backend/**'
      - 'conan-recipes/**'
      - 'infra/conan/**'
      - 'Mia/**'
      - 'mcp-cpp-bridge/**'
      - 'modules/**'
      - 'orchestration/**'
      - 'platforms/**'
      - 'rpi/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'services/**'
      - 'tests/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  CONAN_VERSION: '2.3.2'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      schema: ${{ steps.filter.outputs.schema }}
      cpp: ${{ steps.filter.outputs.cpp }}
      esp32: ${{ steps.filter.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'pytest.ini'
              - 'requirements*.txt'
              - 'agents/**'
              - 'apps/rpi-backend/py-api/**'
              - 'apps/rpi-backend/shared/**'
              - 'Mia/**'
              - 'modules/**'
              - 'orchestration/**'
              - 'rpi/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'services/**'
              - 'tests/**'
              - 'tools/**'
            schema:
              - '.github/workflows/ci.yml'
              - 'apps/rpi-backend/cpp-audio/core/webgrab.fbs'
              - 'protos/**'
              - 'schemas/**'
              - 'schemas/generate.py'
              - 'scripts/generate-schemas.sh'
            cpp:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'apps/rpi-backend/cpp-audio/**'
              - 'conan-recipes/**'
              - 'infra/conan/**'
              - 'mcp-cpp-bridge/**'
              - 'platforms/cpp/**'
            esp32:
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - 'apps/esp32/**'

  schema-validation:
    if: needs.changes.outputs.schema == 'true'
    name: Schema Validation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install flatc
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler
      - name: Validate schemas compile
        run: |
          mkdir -p /tmp/fb-validate
          flatc --python -o /tmp/fb-validate schemas/vehicle_telemetry.fbs schemas/mia.fbs
          flatc --python -o /tmp/fb-validate schemas/vehicle_telemetry.fbs protos/vehicle.fbs
          flatc --cpp --gen-mutable --scoped-enums -o /tmp/fb-validate apps/rpi-backend/cpp-audio/core/webgrab.fbs
      - name: Detect schema drift
        run: |
          mkdir -p /tmp/fb-drift
          flatc --python -o /tmp/fb-drift schemas/vehicle_telemetry.fbs schemas/mia.fbs
          drifted=0
          for gen in /tmp/fb-drift/Mia/*.py; do
            fname=$(basename "$gen")
            committed="Mia/$fname"
            if [ -f "$committed" ]; then
              if ! diff -q "$gen" "$committed" > /dev/null 2>&1; then
                echo "DRIFT: $committed differs from regenerated output"
                diff --unified "$committed" "$gen" || true
                drifted=1
              fi
            else
              echo "NEW: $fname generated but not committed"
              drifted=1
            fi
          done
          if [ "$drifted" -eq 1 ]; then
            echo "::warning::Schema drift detected — run 'python schemas/generate.py --all' and commit the result"
          fi
      - name: Check schema and contract coordination
        if: github.event_name == 'pull_request'
        run: |
          # If schemas changed, check that contracts are also updated (or at least reviewed)
          schema_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- schemas/ protos/ Mia/ | wc -l)
          contract_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- contracts/ | wc -l)
          if [ "$schema_changed" -gt 0 ] && [ "$contract_changed" -eq 0 ]; then
            echo "::warning::Schema files changed but contracts/ was not updated. Verify that contracts/events.md and contracts/topics.md still match."
          fi

  lint:
    if: needs.changes.outputs.python == 'true'
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8 black isort
      - name: flake8
        continue-on-error: true
        run: >
          flake8 orchestration/ tests/ apps/rpi-backend/ agents/ services/ scripts/
          --max-line-length=120
          --extend-ignore=E203,W503,W293,W291,E402,E302,E305,E501
          --per-file-ignores='tests/*:F401,F811'
          --exclude=__pycache__,*.pyc
          --count
      - name: black --check
        run: >
          black --check --line-length 120
          --exclude '/(\.git|\.venv|venv|build|apps/android|apps/esp32|platforms/cpp|Mia/Vehicle|web|\.backups|exported-assets)/'
          .
        continue-on-error: true
      - name: isort --check
        run: isort --check --profile black --skip .venv --skip venv --skip apps/android --skip web .
        continue-on-error: true

  python-test:
    if: needs.changes.outputs.python == 'true'
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Conan & configure remotes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force
          conan remote add sparetools https://conan.cloudsmith.io/sparesparrow-conan/sparetools/ --index 0 || true
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-cpython-${{ hashFiles('infra/conan/conanfile.py', '.tool-versions') }}
          restore-keys: conan-cpython-
      - name: Install bundled CPython via Conan
        run: |
          conan install --tool-requires=sparetools-cpython/3.12.7 --build=missing -g VirtualBuildEnv
          source conanbuild.sh
          python3 --version
          which python3
      - name: Install dependencies with bundled Python
        run: |
          source conanbuild.sh
          python3 -m pip install --upgrade pip "setuptools<82" wheel
          python3 -m pip install -r requirements-ci.txt
      - name: Run tests
        run: |
          source conanbuild.sh
          python3 -m pytest tests/ -v -m "not hardware" --tb=short -q

  cpp-build:
    if: needs.changes.outputs.cpp == 'true'
    name: C++ Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, profile: linux-release, conan_arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Conan & configure remotes
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force
          conan remote add sparetools https://conan.cloudsmith.io/sparesparrow-conan/sparetools/ --index 0 || true
      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.arch }}-${{ hashFiles('infra/conan/conanfile.py', '.tool-versions') }}
          restore-keys: conan-${{ matrix.arch }}-
      - name: Build
        run: |
          cd platforms/cpp
          conan install ../.. --build=missing
          cmake -B build .
          cmake --build build -j$(nproc)

  esp32-build:
    if: needs.changes.outputs.esp32 == 'true'
    name: ESP32 Build
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Check for PlatformIO config
        id: check
        run: |
          if [ -f apps/esp32/platformio.ini ]; then
            echo "has_pio=true" >> $GITHUB_OUTPUT
          else
            echo "has_pio=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/cache@v4
        if: steps.check.outputs.has_pio == 'true'
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('apps/esp32/platformio.ini') }}
      - name: Build with PlatformIO
        if: steps.check.outputs.has_pio == 'true'
        run: |
          python -m pip install --upgrade pip platformio
          cd apps/esp32
          pio run
