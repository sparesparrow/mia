name: Python CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'orchestrator-config.yaml'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'orchestrator-config.yaml'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install PyYAML 6.0.1 first (has wheels, avoids build issues)
          pip install "PyYAML==6.0.1"
          # Try dev requirements first, fallback to production
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt || pip install -r requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest pytest-asyncio pytest-cov flake8 mypy
          fi
          pip install jsonschema

      - name: Lint (flake8)
        continue-on-error: true
        run: flake8 . --exclude="Mia/Vehicle/*.py,web/monitor-gonzo.py,tests/,android/,platforms/cpp/" --max-line-length=120 --extend-ignore=E203,W503

      - name: Type check (mypy)
        continue-on-error: true
        run: mypy --ignore-missing-imports modules/ rpi/ || true

      - name: Run tests (skip hardware tests)
        run: pytest tests/ -v -m "not hardware" --tb=short || pytest tests/unit/ -v

      - name: Validate orchestrator config against schema
        run: |
          python - <<'PY'
          import json, yaml, sys
          from jsonschema import validate
          with open('contracts/config.schema.json') as f:
              schema = json.load(f)
          with open('orchestrator-config.yaml') as f:
              data = yaml.safe_load(f)
          validate(instance=data, schema=schema)
          print('Config validation: OK')
          PY

