name: MIA Car Assistant Build, Test & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Run deployment to Raspberry Pi'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  build-and-test:
    name: 🧪 Build & Test Car Assistant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies for tests
        run: |
          python -m pip install --upgrade pip
          pip install websockets aiohttp fastapi pydantic uvicorn pytest pytest-asyncio

      - name: Install Conan and Sparetools MIA package
        run: |
          pip install "conan>=2.0.0,<3.0.0"
          conan profile detect --force || true
          # Leverage sparetools packages (best‑effort, non‑blocking)
          conan install sparetools-mia/2.0.0@sparesparrow/stable || echo "sparetools-mia Conan install skipped or failed (non‑blocking)"

      - name: Run Car Assistant MCP integration tests
        run: |
          python test_mia_mcp_integration.py

  deploy-car-assistant:
    name: 🚀 Deploy Car Assistant to Raspberry Pi
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && (github.event_name != 'workflow_dispatch' || inputs.deploy == 'true')

    env:
      RPI_HOST: ${{ secrets.RPI_HOST }}
      RPI_USER: ${{ secrets.RPI_USER || 'pi' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RPI_SSH_KEY }}

      - name: Add Raspberry Pi host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$RPI_HOST" >> ~/.ssh/known_hosts

      - name: Deploy using deploy_car_assistant.sh via SSH
        run: |
          if [ -z "$RPI_HOST" ]; then
            echo "RPI_HOST secret is not set. Skipping deployment."
            exit 0
          fi

          REPO_URL="https://github.com/${{ github.repository }}.git"

          ssh "${RPI_USER}@${RPI_HOST}" bash -c "'
            set -e
            if [ -d ~/mia ]; then
              cd ~/mia
              git pull --ff-only || true
            else
              git clone \"$REPO_URL\" ~/mia
              cd ~/mia
            fi
            chmod +x deploy_car_assistant.sh
            sudo ./deploy_car_assistant.sh
          '"

