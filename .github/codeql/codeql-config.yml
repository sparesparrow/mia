name: "MIA CodeQL Config"

# Disable default queries if needed
disable-default-queries: false

# Query suites to run
queries:
  - uses: security-and-quality
  - uses: security-extended

# Paths to ignore during analysis
paths-ignore:
  - "tests/**"
  - "**/*.test.py"
  - "**/test_*.py"
  - ".backups/**"
  - "exported-assets/**"
  - "apps/android/build/**"
  - "apps/rpi-backend/cpp-audio/build/**"
  - "**/node_modules/**"

# Paths to include (optional, analyze all if not specified)
paths:
  - "orchestration/mcp/**"
  - "apps/rpi-backend/py-api/**"
  - "apps/rpi-backend/cpp-audio/**"
  - "apps/android/app/src/**"
