[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Serial Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Library dependencies
lib_deps =

; Upload options
upload_speed = 921600

; ESP-IDF specific options
board_build.esp-idf.sdkconfig_path = sdkconfig.defaults

[env:esp32cam-anpr]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter =
    +<camera_anpr.cpp>
    -<main.c>
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=1
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

[env:esp32s3-anpr]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<camera_anpr.cpp>
    -<main.c>
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyACM*
upload_protocol = esp-builtin
board_build.flash_mode = dio
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPWDN_GPIO_NUM=-1
    -DRESET_GPIO_NUM=-1
    -DXCLK_GPIO_NUM=40
    -DSIOD_GPIO_NUM=17
    -DSIOC_GPIO_NUM=18
    -DY9_GPIO_NUM=39
    -DY8_GPIO_NUM=41
    -DY7_GPIO_NUM=42
    -DY6_GPIO_NUM=12
    -DY5_GPIO_NUM=3
    -DY4_GPIO_NUM=14
    -DY3_GPIO_NUM=47
    -DY2_GPIO_NUM=13
    -DVSYNC_GPIO_NUM=21
    -DHREF_GPIO_NUM=38
    -DPCLK_GPIO_NUM=11
    -DFLASH_GPIO_NUM=-1
lib_deps =
    bblanchon/ArduinoJson@^6.21.5