schema_version: 1
cycle: 1
name: passive-telemetry-vertical-slice
updated: 2026-09-24

scope:
  signals: [ignition, battery_voltage, engine_rpm, coolant_temp_c]
  path: [bench_or_replay_can, esp32_passive_capture, pi_normalization, android_websocket]
  excluded: [active_uds, actuation, roof_or_lock_control, live_audi_signal_mapping]

safety:
  passive_capture_only: true
  active_uds: false
  actuation: false
  vehicle_transmit_allowed: false
  car_build_requires_physical_txd_disconnect: true

specialists:
  status:
    state: implemented_and_ci_tested
    claim: machine-readable Cycle 1 evidence matrix exists
    proof: docs/status/cycle1.yaml and tests/unit/test_cycle1_status.py
    not_proven: target-device and vehicle deployment
  contract:
    state: implemented_and_ci_tested
    claim: four-signal envelope includes provenance and confidence
    proof: schemas/vehicle_telemetry_envelope.schema.json and tests/unit/test_cycle1_replay.py
    not_proven: compatibility with external legacy consumers
  virtual_can:
    state: simulation_tested
    claim: JSONL replay reconstructs a complete envelope without a vehicle
    proof: tests/fixtures/cycle1_bench.jsonl and tools/vehicle-replay/replay.py
    not_proven: SocketCAN timing and real vehicle capture
  esp32:
    state: implemented_and_ci_tested
    claim: passive build receives frames and excludes twai_transmit at compile time
    proof: tests/unit/test_esp32_listen_only_contract.py and existing ESP-IDF build
    not_proven: board flashing and vehicle installation
  pi_runtime:
    state: implemented_and_ci_tested
    claim: passive CAN or complete flat telemetry can be normalized for the API
    proof: shared telemetry module, serial_bridge.py, /telemetry/cycle1 and /ws/telemetry
    not_proven: target Raspberry Pi deployment
  android:
    state: implemented_and_ci_tested
    claim: dashboard can deserialize/display the canonical envelope and offline state
    proof: Cycle1 DTO/ViewModel/Card and Android tests
    not_proven: real-phone connection to target Pi
  replay_ci:
    state: implemented_and_ci_tested
    claim: synthetic vector is schema-validated in CI
    proof: cycle1-replay GitHub Actions job
    not_proven: recorded vehicle trace
  docs:
    state: implemented_and_ci_tested
    claim: safety and evidence boundaries are explicit
    proof: docs/status/cycle1.yaml and docs/status/cycle1.md
    not_proven: physical connector and bus measurements on Audi 8H
