<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Porovnání 3,3V a 5V CAN budiče připojeného k ESP32">
<title>Volba CAN budiče pro ESP32</title><defs><marker id="a0f6b35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6b35"/></marker><marker id="aa40e26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a40e26"/></marker><marker id="a0a4ea3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a4ea3"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="980" height="470" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#1f2328">CAN budič k ESP32 — 3,3 V vs. 5 V</text>
<text x="40" y="58" font-size="12.5" fill="#57606a">docs/wiring.md uvádí obě varianty vedle sebe. Zaměnitelné nejsou.</text>
<rect x="40" y="70" width="420" height="356" rx="12" fill="#ffffff" stroke="#0f6b35" stroke-width="2"/><rect x="520" y="70" width="420" height="356" rx="12" fill="#ffffff" stroke="#a40e26" stroke-width="2" stroke-dasharray="6 4"/><text x="250.0" y="98" font-size="16" font-weight="700" text-anchor="middle" fill="#0f6b35">✓ SN65HVD230 — 3,3 V budič</text><text x="730.0" y="98" font-size="16" font-weight="700" text-anchor="middle" fill="#a40e26">✗ TJA1050 přímo — 5 V budič</text><rect x="100" y="115" width="300" height="44" rx="8" fill="#cfe4fd" stroke="#0a4ea3" stroke-width="1.5"/><text x="250" y="141" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a4ea3">CAN_H / CAN_L  —  OBD piny 6 a 14</text><line x1="250.0" y1="159" x2="250.0" y2="186" stroke="#57606a" stroke-width="2.2" marker-end="url(#a57606a)"/><rect x="100" y="188" width="300" height="52" rx="8" fill="#d4f5dd" stroke="#0f6b35" stroke-width="1.5"/><text x="250" y="210" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0f6b35">SN65HVD230</text><text x="250" y="226" font-size="12.5" font-weight="400" text-anchor="middle" fill="#0f6b35">VCC = 3,3 V</text><line x1="250.0" y1="240" x2="250.0" y2="282" stroke="#0f6b35" stroke-width="2.2" marker-end="url(#a0f6b35)"/><text x="258" y="255" font-size="12" font-weight="600" fill="#0f6b35">RXD 3,3 V</text><rect x="100" y="284" width="300" height="52" rx="8" fill="#d4f5dd" stroke="#0f6b35" stroke-width="1.5"/><text x="250" y="306" font-size="12" font-weight="600" text-anchor="middle" fill="#0f6b35">ESP32 GPIO16 (TWAI RX)</text><text x="250" y="322" font-size="12" font-weight="400" text-anchor="middle" fill="#0f6b35">vstup max 3,3 V — není 5V tolerantní</text><text x="250.0" y="366" font-size="13" font-weight="700" text-anchor="middle" fill="#0f6b35">Jedna napěťová doména, žádný převodník</text><text x="250.0" y="390" font-size="12" text-anchor="middle" fill="#57606a">Rs pin přes 10 kΩ na GND = normální rychlost.</text><text x="250.0" y="410" font-size="12" text-anchor="middle" fill="#57606a">Pro pasivní odposlech TXD fyzicky nezapojuj.</text><rect x="580" y="115" width="300" height="44" rx="8" fill="#cfe4fd" stroke="#0a4ea3" stroke-width="1.5"/><text x="730" y="141" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0a4ea3">CAN_H / CAN_L  —  OBD piny 6 a 14</text><line x1="730.0" y1="159" x2="730.0" y2="186" stroke="#57606a" stroke-width="2.2" marker-end="url(#a57606a)"/><rect x="580" y="188" width="300" height="52" rx="8" fill="#ffd7d5" stroke="#a40e26" stroke-width="1.5"/><text x="730" y="210" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a40e26">TJA1050</text><text x="730" y="226" font-size="12.5" font-weight="400" text-anchor="middle" fill="#a40e26">VCC = 5 V</text><line x1="730.0" y1="240" x2="730.0" y2="282" stroke="#a40e26" stroke-width="2.2" marker-end="url(#aa40e26)"/><text x="738" y="255" font-size="12" font-weight="600" fill="#a40e26">RXD 5 V</text><rect x="580" y="284" width="300" height="52" rx="8" fill="#ffd7d5" stroke="#a40e26" stroke-width="1.5"/><text x="730" y="306" font-size="12" font-weight="600" text-anchor="middle" fill="#a40e26">ESP32 GPIO16 (TWAI RX)</text><text x="730" y="322" font-size="12" font-weight="400" text-anchor="middle" fill="#a40e26">vstup max 3,3 V — není 5V tolerantní</text><text x="730.0" y="366" font-size="13" font-weight="700" text-anchor="middle" fill="#a40e26">5 V na 3,3V pin = poškození vstupu</text><text x="730.0" y="390" font-size="12" text-anchor="middle" fill="#57606a">Nutný level shifter na RXD, nebo rovnou 3,3V budič.</text><text x="730.0" y="410" font-size="12" text-anchor="middle" fill="#57606a">TXD z ESP32 do TJA1050 projde, opačný směr ne.</text>
<text x="40" y="452" font-size="11.5" fill="#57606a">Napěťové úrovně ověřuj v datasheetu konkrétního kusu — existují i 3,3V varianty v pouzdrech podobných TJA1050 (např. TJA1051T/3 s pinem VIO).</text>
</svg>
