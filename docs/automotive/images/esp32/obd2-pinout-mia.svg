<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" width="980" height="415" role="img" aria-label="Pinout konektoru OBD-II s vyznačenými piny, které MIA používá">
<title>OBD-II (J1962) — piny, které MIA používá</title>
<rect x="0" y="0" width="980" height="415" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="40" font-size="19" font-weight="700" fill="#1f2328">OBD-II (J1962) — které piny MIA používá</text>
<text x="60" y="62" font-size="12.5" fill="#57606a">Pohled zepředu na zásuvku ve vozidle. Čísla bývají vylisovaná v plastu konektoru — ověř si je, u protikusu je řada zrcadlově.</text>
<path d="M 130.0,96 L 850.0,96 L 806.0,244 L 174.0,244 Z" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/><circle cx="190.0" cy="140" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="190.0" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">1</text><circle cx="275.7142857142857" cy="140" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="275.7142857142857" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">2</text><circle cx="361.42857142857144" cy="140" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="361.42857142857144" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">3</text><circle cx="447.1428571428571" cy="140" r="17" fill="#e6e8eb" stroke="#57606a" stroke-width="2"/><text x="447.1428571428571" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#57606a">4</text><text x="447.1428571428571" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#57606a">GND</text><circle cx="532.8571428571429" cy="140" r="17" fill="#e6e8eb" stroke="#57606a" stroke-width="2"/><text x="532.8571428571429" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#57606a">5</text><text x="532.8571428571429" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#57606a">GND</text><circle cx="618.5714285714286" cy="140" r="17" fill="#cfe4fd" stroke="#0a4ea3" stroke-width="2"/><text x="618.5714285714286" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#0a4ea3">6</text><text x="618.5714285714286" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a4ea3">CAN_H</text><circle cx="704.2857142857142" cy="140" r="17" fill="#e8dcff" stroke="#5a3aa8" stroke-width="2"/><text x="704.2857142857142" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#5a3aa8">7</text><text x="704.2857142857142" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#5a3aa8">K-line</text><circle cx="790.0" cy="140" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="790.0" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">8</text><circle cx="234.0" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="234.0" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">9</text><circle cx="307.1428571428571" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="307.1428571428571" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">10</text><circle cx="380.2857142857143" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="380.2857142857143" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">11</text><circle cx="453.42857142857144" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="453.42857142857144" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">12</text><circle cx="526.5714285714286" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="526.5714285714286" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">13</text><circle cx="599.7142857142857" cy="204" r="17" fill="#cfe4fd" stroke="#0a4ea3" stroke-width="2"/><text x="599.7142857142857" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#0a4ea3">14</text><text x="599.7142857142857" y="242" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0a4ea3">CAN_L</text><circle cx="672.8571428571429" cy="204" r="17" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="672.8571428571429" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#8c959f">15</text><circle cx="746.0" cy="204" r="17" fill="#ffd7d5" stroke="#a40e26" stroke-width="2"/><text x="746.0" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#a40e26">16</text><text x="746.0" y="242" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a40e26">+12 V</text><rect x="60" y="277" width="18" height="18" rx="5" fill="#cfe4fd" stroke="#0a4ea3" stroke-width="1.5"/><text x="88" y="291" font-size="13" font-weight="600" fill="#0a4ea3">CAN_H / CAN_L — piny 6 a 14</text><text x="330" y="291" font-size="12.5" fill="#57606a">kroucený pár na budič; 500 kbit/s, 11bit</text><rect x="60" y="305" width="18" height="18" rx="5" fill="#e6e8eb" stroke="#57606a" stroke-width="1.5"/><text x="88" y="319" font-size="13" font-weight="600" fill="#57606a">GND — piny 4 a 5</text><text x="330" y="319" font-size="12.5" fill="#57606a">4 = kostra, 5 = signálová zem; použij 4 nebo 5, ne obě</text><rect x="60" y="333" width="18" height="18" rx="5" fill="#e8dcff" stroke="#5a3aa8" stroke-width="1.5"/><text x="88" y="347" font-size="13" font-weight="600" fill="#5a3aa8">K-line — pin 7</text><text x="330" y="347" font-size="12.5" fill="#57606a">starší KWP2000 jednotky; MIA zatím nepoužívá</text><rect x="60" y="361" width="18" height="18" rx="5" fill="#ffd7d5" stroke="#a40e26" stroke-width="1.5"/><text x="88" y="375" font-size="13" font-weight="600" fill="#a40e26">+12 V — pin 16</text><text x="330" y="375" font-size="12.5" fill="#57606a">trvalé napětí, slabě jištěné — NEPOUŽÍVEJ pro napájení Pi</text>
<text x="60" y="398" font-size="11.5" fill="#57606a">Neoznačené piny jsou výrobcem volitelné a u různých značek vedou různé signály. Nic k nim nepřipojuj, dokud nevíš, co na nich je.</text>
</svg>
