    - name: OBD Transport Agent (MCP)
      state: IMPLEMENTED
      description: MCP-compatible OBD-II with FlatBuffers, Android USB-OTG, ISO-TP queue
      services: []
      files: [orchestration/mcp/modules/obd-transport-agent/]

    - name: Automotive MCP Bridge
      state: IMPLEMENTED
