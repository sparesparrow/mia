# MIA Feature Catalog
# Machine-readable catalog of all MIA capabilities and their development state.
# States: IDEA | PLANNED | IMPLEMENTED | TESTED | QA | DEPLOYED
# Served at GET /features by the FastAPI gateway.

categories:

  # ── Hardware ──────────────────────────────────────────────────────────────
  hardware:
    - name: GPIO Control
      state: DEPLOYED
      description: Digital I/O pin control via ZeroMQ with REST endpoints
      services: [mia-gpio-worker, mia-api]
      files: [hardware/gpio.py, hardware/gpio_worker.py]

    - name: I2C Sensor Drivers
      state: TESTED
      description: BME280, SHT30, ADS1115 drivers with calibration and factory function
      services: [mia-api]
      files: [hardware/sensors_i2c.py, hardware/sensors.py]

    - name: Arduino Serial Communication
      state: TESTED
      description: Handshake, device discovery, text-based command/response protocol
      services: [mia-serial-bridge]
      files: [hardware/arduino.py, arduino/MIAProtocol/]

    - name: Serial Bridge (MCU Telemetry)
      state: DEPLOYED
      description: USB serial to ZeroMQ PUB bridge with auto-detect, exponential backoff reconnect, mcu/status events
      services: [mia-serial-bridge]
      files: [hardware/serial_bridge.py]

    - name: LED Strip Controller (WS2812B)
      state: TESTED
      description: 23-LED AI state visualizer with drive/parked/night/service modes
      services: [mia-led-monitor]
      files: [hardware/led_controller.py, arduino/led_strip_controller/]

    - name: Hardware Manager
      state: TESTED
      description: Unified interface for DeviceRegistry, GPIO, Sensors, Arduino
      services: [mia-api]
      files: [hardware/hardware_manager.py]

    - name: USB Camera Service
      state: IMPLEMENTED
      description: Camera discovery, stream lifecycle, hotplug via ZeroMQ + MQTT
      services: [mia-usb-camera]
      files: [services/usb_camera_service.py]

    - name: ESP32 OBD Firmware
      state: IMPLEMENTED
      description: ESP32 ELM327 emulator firmware, Serial2 state updates
      services: []
      files: [firmware/esp32_obd/src/main.cpp]

  # ── Networking ───────────────────────────────────────────────────────────
  networking:
    - name: ZeroMQ Message Broker
      state: DEPLOYED
      description: ROUTER-DEALER broker on :5555, worker registration, request/response routing
      services: [zmq-broker]
      files: [core/messaging/broker.py, core/messaging/client.py]

    - name: FastAPI REST Backend
      state: DEPLOYED
      description: Async REST API with device, GPIO, telemetry, LED, session endpoints
      services: [mia-api]
      files: [api/main.py, api/server.py]

    - name: WebSocket Real-Time Telemetry
      state: DEPLOYED
      description: "/ws and /ws/telemetry endpoints at 10Hz for telemetry + LED state"
      services: [mia-api]
      files: [api/main.py]

    - name: BLE Advertising
      state: IMPLEMENTED
      description: RPi discoverable as MIA OBD-II Adapter via BlueZ D-Bus
      services: [mia-ble-advertiser]
      files: [services/ble_advertiser.py]

    - name: BLE OBD GATT Service
      state: IMPLEMENTED
      description: Nordic UART Service (NUS) bridging Android OBD commands to ZeroMQ
      services: [mia-ble-obd]
      files: [services/ble_obd_service.py]

    - name: Session Management
      state: IMPLEMENTED
      description: Multi-client sessions with 5-min TTL handoff tokens (Android, Quest, web)
      services: [mia-api]
      files: [api/sessions.py]

    - name: Device Registry
      state: DEPLOYED
      description: Persistent registry with health monitoring, auto-discovery, device profiles
      services: [mia-api]
      files: [core/registry/device_registry.py, core/registry/device_profile.py]

  # ── Automotive ───────────────────────────────────────────────────────────
  automotive:
    - name: OBD-II Digital Twin
      state: DEPLOYED
      description: DynamicCarState from hardware telemetry, ELM327 emulator with AT init, CAN auto-detect, retry backoff
