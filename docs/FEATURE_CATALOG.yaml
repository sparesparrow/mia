      services: [zmq-broker, mia-api, mia-gpio-worker, mia-serial-bridge, mia-obd-worker, mia-ble-advertiser, mia-ble-obd, mia-led-monitor, mia-usb-camera, mia-citroen-bridge, mia-audio-capture, mia-wake-word, mia-stt, mia-tts, mia-voice-router, mia-power-monitor, mia-selftest]
      files: [infra/systemd/]

    - name: Docker Compose
      state: IMPLEMENTED
      description: Canonical compose files under infra/docker plus the root Pi simulation stack
      services: []
      files: [infra/docker/, docker-compose.pi-simulation.yml]

    - name: CI/CD (GitHub Actions)
      state: IMPLEMENTED
      description: CI, deploy, security scanning, Android test workflows
