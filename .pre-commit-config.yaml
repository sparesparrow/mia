# Pre-commit hooks for MIA project
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        exclude: ^(\.backups/|exported-assets/|apps/android/|platforms/cpp/)

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^(\.backups/|exported-assets/|apps/android/|platforms/cpp/)

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--extend-ignore=E203,W503"]
        exclude: ^(\.backups/|exported-assets/|apps/android/|platforms/cpp/|Mia/Vehicle/)

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        exclude: ^(apps/android/|\.github/workflows/)
      - id: end-of-file-fixer
        exclude: ^(\.backups/|exported-assets/)
      - id: trailing-whitespace
        exclude: ^(\.backups/|exported-assets/|\.md$)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Security checks
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-ll", "-i"]
        exclude: ^(tests/|\.backups/|exported-assets/)

  # Schema drift detection
  - repo: local
    hooks:
      - id: schema-drift
        name: FlatBuffers schema drift check
        entry: python schemas/generate.py --dry-run
        language: system
        files: ^(schemas/.*\.fbs|protos/.*\.fbs|Mia/.*\.py)$
        pass_filenames: false
