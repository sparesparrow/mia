# /etc/dnsmasq.d/mia.conf — DHCP + DNS for MIA-Car WiFi AP
# Assigns IPs to Android phones connecting to the MIA-Car network.
# RPi is always 192.168.4.1; phones get 192.168.4.10-50.

interface=wlan0
bind-interfaces

# DHCP range
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,24h

# RPi is the gateway and DNS server
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# Resolve "mia" and "mia.local" to the RPi
address=/mia/192.168.4.1
address=/mia.local/192.168.4.1

# Don't forward unresolvable names
bogus-priv
domain-needed
