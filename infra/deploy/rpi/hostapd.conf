# /etc/hostapd/hostapd.conf — MIA-Car WiFi Access Point
# RPi 4B creates its own WiFi network so the Android app can connect
# without any external infrastructure (no home router needed).

interface=wlan0
driver=nl80211
ssid=MIA-Car
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0

# WPA2 Personal
auth_algs=1
wpa=2
wpa_passphrase=mia-car-2026
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Country code (adjust for your region)
country_code=CZ

# 802.11n support for better throughput
ieee80211n=1
