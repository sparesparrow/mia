# /etc/watchdog.conf — MIA hardware watchdog configuration
# BCM2711 (RPi 4B) built-in watchdog via /dev/watchdog
#
# If no process pings the watchdog within the timeout,
# the hardware resets the entire SoC — last-resort recovery.

watchdog-device  = /dev/watchdog
watchdog-timeout = 60

# Reboot if any of these conditions persist
max-load-1       = 24
min-memory       = 1
