services:
  # Scenario-driven client that exercises a deployed MIA stack.
  driver-simulator:
    profiles:
      - legacy-sim
    build:
      context: ./driver-simulator
      dockerfile: Dockerfile
    container_name: mia-driver-sim
    environment:
      - MIA_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--list"]
    networks:
      - mia-pi-network

  # MQTT Broker (shared)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mia-mqtt-pi-sim
    restart: unless-stopped
    ports:
      - "1884:1883"  # Different port to avoid conflicts
      - "9002:9001"
    volumes:
      - ./mosquitto/mosquitto-pi-sim.conf:/mosquitto/config/mosquitto.conf
      - ./volumes/mqtt-pi-data:/mosquitto/data
      - ./volumes/mqtt-pi-logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t mia/pi-healthcheck -m ok >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mia-pi-network

  # Redis for simulation state
  redis:
    image: redis:7-alpine
    container_name: mia-redis-sim
    restart: unless-stopped
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - ./volumes/redis-sim-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mia-pi-network

networks:
  mia-pi-network:
    driver: bridge

volumes:
  mqtt-pi-data:
  mqtt-pi-logs:
  redis-sim-data:
