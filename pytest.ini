[pytest]
# Pytest Configuration for MIA Project

# Minimum pytest version
minversion = 8.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Test markers
markers =
    hardware: tests that require physical hardware (deselect with '-m "not hardware"')
    slow: slow-running tests (deselect with '-m "not slow"')
    integration: integration tests
    unit: unit tests
    automotive: automotive-specific tests
    android: Android app tests (requires Android SDK)
    meta_harness: Meta-Harness optimization loop tests
    req(*ids): requirement IDs from spec/requirements that this test covers (see tests/README.md)

# Output options
addopts =
    -ra
    --strict-markers
    --tb=short
    # Coverage reports apply when --cov is passed; what is measured is set in .coveragerc
    --cov-report=term-missing
    --cov-report=html
