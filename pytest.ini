[pytest]
# Pytest Configuration for MIA Project

# Minimum pytest version
minversion = 8.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Test markers
markers =
    hardware: tests that require physical hardware (deselect with '-m "not hardware"')
    slow: slow-running tests (deselect with '-m "not slow"')
    integration: integration tests
    unit: unit tests
    automotive: automotive-specific tests
    android: Android app tests (requires Android SDK)

# Output options
addopts =
    -ra
    --strict-markers
    --tb=short
    # Coverage options (uncomment when pytest-cov is installed):
    # --cov-report=term-missing
    # --cov-report=html

# Coverage options
[coverage:run]
source = rpi,modules
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
