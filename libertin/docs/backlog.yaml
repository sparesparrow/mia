# Libertin — strukturovaný backlog odvozený ze zadávací dokumentace
# Zdroj požadavků: příloha smlouvy o dílo (mimo repo). Mapování na požadavky:
# docs/requirements-traceability.md. Kódy req: A1-A4, B1-B14, C1-C13.
#
# Tento soubor je JEDINÝ zdroj pravdy o rozsahu a stavu práce. Loop i agenti
# z něj čtou, co je na řadě, a po dokončení sem zapisují stav.
#
# status:   todo | in_progress | review | done | blocked
# scope:    client-web | client-mobile | shared-ui | backend | infra | qa | docs | decision
# role:     který tým/role vlastní (viz .claude/agents/)
# blocked_by: seznam id, které musí být done, nebo důvod blokace v `blocker`

meta:
  contract_scope: full-system   # rozhodnuto objednatelem: celý systém dle smlouvy,
                                # ne pouze klientská vrstva nad legacy API
  legacy_platform: swingerslife.cz   # Laravel; viz docs/live-audit.md
  acceptance_response_budget_ms: 1500   # C12.1 — tvrdý akceptační limit
  languages: [cs, en]                   # B13 — plná dodávka
  vcs_target: gitlab                    # C10 — dnes GitHub, viz D-002

# ---------------------------------------------------------------------------
# ROZHODNUTÍ, která blokují velké bloky práce (vlastník: objednatel)
# ---------------------------------------------------------------------------
decisions:
  - id: D-001
    title: Editor access do Figma hand-off souboru
    req: [C1, A3]
    status: blocked
    blocker: >
      Účet má na souboru pouze seat "View" (starter tier); Figma MCP vyžaduje
      editor access. Bez něj nelze provést design-parity, extrahovat design
      tokens ani zjistit skutečný počet obrazovek = neznámý rozsah díla.
    unblock_options:
      - Editor invite pro dallheimal@gmail.com na soubor BF3X0FKBKEbt5uTcrO4jkk
      - Export všech mockupů (PNG/PDF) do repa
  - id: D-002
    title: GitLab vs GitHub pro hosting a CI/CD
    req: [C10, C11]
    status: blocked
    blocker: Smlouva vyžaduje GitLab; vývoj běží na GitHubu. Mirror nebo přesun?
  - id: D-003
    title: Backend stack — rozšířit legacy Laravel, nebo psát nově?
    req: [A3, C3, C6]
    status: blocked
    blocker: >
      Smlouva říká "vyvíjen od nuly", ale legacy je Laravel s daty k migraci
      (C13). Volba určuje E9 i migrační strategii. Podklad: RES-001.
  - id: D-004
    title: Hosting a poskytovatel cloudu
    req: [A1, C2, C5]
    status: blocked
    blocker: >
      Smlouva jmenuje DigitalOcean/AWS a zároveň žádá maximum on-premise (C2).
      Nutno sladit s rozpočtem a požadavkem na HA.
  - id: D-006
    title: Smí být SMS jediným aktivním druhým faktorem člena?
    req: [B4.2, B14]
    status: blocked
    blocker: >
      security doporučuje ne (nejdřív TOTP nebo passkey) kvůli SIM swapu;
      doslovné čtení B4.2 lze ale vyložit tak, že SMS samotná stačí. Obě
      varianty i návrh fallbacku jsou v ADR 0001 §15. Blokuje E2-T4.

  - id: D-005
    title: AI-asistovaná moderace obsahu — mimo smlouvu, navrženo
    req: [C2]
    status: blocked
    blocker: >
      Adult platforma prakticky potřebuje moderaci nahrávaného obsahu, smlouva
      ji ale nezmiňuje a C2 nařizuje minimalizaci externích služeb. Vyžaduje
      výslovné schválení (rozsah, cena, právní rámec) i volbu on-prem vs API.

