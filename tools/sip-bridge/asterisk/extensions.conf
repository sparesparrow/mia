; extensions.conf — MIA SIP bridge dial plan

[globals]
MIA_WS      = ws://192.168.200.23:8000/ws
MIA_PHONE   = +420735204654

; ── Calls arriving from ElevenLabs SIP trunk ──────────────────────────────────
[from-elevenlabs]
; Any inbound call → hand to MIA AGI voice bridge
exten => _+.,1,NoOp(ElevenLabs inbound: ${CALLERID(num)} → ${EXTEN})
 same  => n,Set(CHANNEL(language)=cs)
 same  => n,Answer()
 same  => n,AGI(mia_voice_bridge.py,${EXTEN},${CALLERID(num)})
 same  => n,Hangup()

; MIA phone number direct route
exten => +420735204654,1,Goto(from-elevenlabs,_+.,1)

; ── Internal routing from MIA pipeline back to ElevenLabs ─────────────────────
[mia-internal]
; MIA AGI initiates outbound via ElevenLabs trunk (when outbound enabled)
exten => _+.,1,NoOp(MIA outbound: ${EXTEN})
 same  => n,Dial(PJSIP/${EXTEN}@elevenlabs-trunk,60,g)
 same  => n,Hangup()
