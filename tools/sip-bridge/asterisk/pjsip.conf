; pjsip.conf — ElevenLabs SIP trunk for MIA studio node
; Auto-generated by tools/sip-bridge — edit ELEVENLABS_SIP_DOMAIN in config.py

[transport-udp]
type        = transport
protocol    = udp
bind        = 0.0.0.0:5060
external_media_address = ${STUDIO_LAN_IP}
external_signaling_address = ${STUDIO_LAN_IP}

; ── ElevenLabs trunk (inbound from ElevenLabs SIP domain) ─────────────────────

[elevenlabs-auth]
type        = auth
auth_type   = userpass
username    = ${SIP_TRUNK_USERNAME}
password    = ${SIP_TRUNK_PASSWORD}

[elevenlabs-aor]
type        = aor
contact     = sip:${ELEVENLABS_SIP_DOMAIN}
qualify_frequency = 30

[elevenlabs-trunk]
type                  = endpoint
context               = from-elevenlabs
transport             = transport-udp
aors                  = elevenlabs-aor
auth                  = elevenlabs-auth
outbound_auth         = elevenlabs-auth
allow                 = ulaw,alaw,g722
direct_media          = no
rtp_symmetric         = yes
force_rport           = yes
rewrite_contact       = yes
from_domain           = ${ELEVENLABS_SIP_DOMAIN}
from_user             = ${SIP_TRUNK_USERNAME}
dtmf_mode             = rfc4733

; ── Identify: match inbound SIP from ElevenLabs domain ────────────────────────

[elevenlabs-identify]
type        = identify
endpoint    = elevenlabs-trunk
match       = sip.elevenlabs.io

; ── MIA local endpoint (AGI bridge connects here) ─────────────────────────────

[mia-local]
type        = endpoint
context     = mia-internal
transport   = transport-udp
allow       = ulaw
auth        = mia-local-auth
aors        = mia-local-aor
direct_media = no

[mia-local-auth]
type        = auth
auth_type   = userpass
username    = mia-internal
password    = ${SIP_TRUNK_PASSWORD}

[mia-local-aor]
type        = aor
max_contacts = 1
