[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Serial Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Library dependencies
lib_deps =

; Upload options
upload_speed = 921600

; ESP-IDF specific options
board_build.embed_txtfiles =
    src/certs/server_cert.pem
    src/certs/server_key.pem