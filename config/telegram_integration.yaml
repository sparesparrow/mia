# MIA Telegram MCP Transport Integration Configuration

telegram_mcp:
  enabled: true

  # MCP Transport Configuration
  transport:
    name: "mcp-transport-telegram"
    type: "external_process"
    command: ["python", "-m", "mcp_transport_telegram"]
    working_directory: "/home/sparrow/projects/ai-mcp-monorepo/packages/mcp-transport-telegram"

    # Environment variables for MCP transport
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_PHONE: "${TELEGRAM_PHONE:-}"
      TELEGRAM_SESSION_NAME: "mia_telegram_session"
      TELEGRAM_POLLING_INTERVAL: "30"
      TELEGRAM_MAX_MESSAGE_AGE: "3600"
      TELEGRAM_RATE_LIMIT_PER_MINUTE: "30"

  # MIA Integration Settings
  integration:
    # Service registration in orchestrator
    service_name: "mcp-transport-telegram"
    capabilities: ["messaging", "media", "contacts", "telegram"]
    service_type: "mcp"

    # Message routing configuration
    routing:
      # Prompts to use for different message types
      default_prompt: "general_assistant"
      media_prompt: "media_analysis"
      error_prompt: "error_handler"

      # Chat-specific routing rules
      chat_routing:
        - pattern: "@mia_bot"
          prompt: "telegram_bot_assistant"
        - chat_id: 123456789
          prompt: "customer_support"
        - username: "@support"
          prompt: "technical_support"

      # Intent-based routing
      intent_routing:
        communication: "communication_assistant"
        file_operation: "file_manager"
        hardware_control: "hardware_controller"
        smart_home: "home_automation"

    # Context management
    context:
      preserve_chat_history: true
      preserve_thread_context: true
      max_session_age_hours: 24
      max_messages_per_session: 1000

      # Rate limiting per chat
      rate_limits:
        messages_per_minute_per_chat: 10
        media_downloads_per_hour: 50
        max_concurrent_sessions: 100

    # Response formatting
    formatting:
      add_emojis: true
      show_confidence: false
      max_response_length: 4000
      truncate_messages: true

  # Monitoring and logging
  monitoring:
    enable_metrics: true
    log_message_content: false  # Set to true only for debugging
    alert_on_errors: true
    health_check_interval_seconds: 60

    # Metrics to collect
    metrics:
      - messages_processed_total
      - messages_by_intent
      - response_time_seconds
      - error_rate_percentage
      - active_sessions_total

  # Security settings
  security:
    # Only process messages from these chats (empty = allow all)
    allowed_chat_ids: []

    # Block messages from these users
    blocked_users: []

    # Require user verification for sensitive operations
    require_verification: false

    # Message content filtering
    content_filtering:
      enabled: false
      block_patterns: []
      allow_patterns: []

  # Advanced features
  features:
    # Conversation threading support
    threading:
      enabled: true
      inherit_context: true
      max_thread_depth: 5

    # Message summarization
    summarization:
      enabled: false  # Requires mcp-prompts integration
      summarize_after_messages: 50
      summary_prompt: "conversation_summarizer"

    # Media processing
    media_processing:
      enabled: true
      auto_download: true
      supported_types: ["photo", "document", "audio", "video"]
      max_file_size_mb: 50

    # Contact management
    contacts:
      enabled: true
      sync_interval_hours: 24
      cache_contacts: true

# Environment variable validation
required_environment_variables:
  - TELEGRAM_API_ID
  - TELEGRAM_API_HASH
  - TELEGRAM_BOT_TOKEN

optional_environment_variables:
  - TELEGRAM_PHONE
  - TELEGRAM_SESSION_NAME
  - TELEGRAM_POLLING_INTERVAL
  - TELEGRAM_MAX_MESSAGE_AGE
  - TELEGRAM_RATE_LIMIT_PER_MINUTE

# Integration health checks
health_checks:
  - name: "telegram_api_connection"
    type: "api_call"
    endpoint: "telegram_api_status"
    interval_seconds: 300
    timeout_seconds: 10

  - name: "mcp_transport_process"
    type: "process_check"
    process_name: "mcp_transport_telegram"
    interval_seconds: 60

  - name: "message_processing_queue"
    type: "queue_length"
    max_length: 1000
    interval_seconds: 30