site_name: MIA Documentation
site_description: Vehicle telemetry and IoT control on Raspberry Pi, ESP32 and Android
repo_url: https://github.com/sparesparrow/mia
repo_name: sparesparrow/mia
site_url: https://sparesparrow.github.io/mia/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.expand
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  icon:
    repo: fontawesome/brands/github

# ─── Validation ───────────────────────────────────────────────────────────────
# broken relative links in legacy docs point to files that don't exist yet;
# downgrade those to info so --strict doesn't fail the build.
# docs/spec is a symlink to ../spec, so the requirements, decisions, architecture and interface
# specs are published with the guides without being copied.
validation:
  nav:
    omitted_files: info      # files in docs/ not listed in nav → info, not warn
    not_found: warn          # nav entries pointing to missing files → keep strict
  links:
    not_found: ignore
    unrecognized_links: ignore
    absolute_links: ignore

# ─── Navigation ───────────────────────────────────────────────────────────────
nav:
  - Overview: index.md

  - Getting Started:
    - Quick Start: getting-started/QUICK_START.md
    - Android Device Setup: android-device-setup.md

  - Specification:
    - How MIA is specified: spec/README.md
    - Decisions (ADRs):
      - Index: spec/decisions/README.md
      - 0001 Decisions and backlog in issues: spec/decisions/0001-record-decisions-and-keep-the-backlog-in-issues.md
      - 0002 Requirements, code and tests: spec/decisions/0002-separate-requirements-code-and-tests.md
      - 0003 ZeroMQ control plane: spec/decisions/0003-zeromq-control-plane-and-telemetry.md
      - 0004 FlatBuffers wire format: spec/decisions/0004-flatbuffers-wire-format.md
      - 0005 Raspberry Pi edge: spec/decisions/0005-raspberry-pi-edge-with-fastapi-gateway.md
      - 0006 Passive vehicle access: spec/decisions/0006-passive-vehicle-access-by-default.md
      - 0007 Simulation fallback: spec/decisions/0007-simulation-fallback-for-hardware.md
      - 0008 Audi A4 8H primary: spec/decisions/0008-audi-a4-8h-primary-citroen-secondary.md
      - 0009 Telemetry envelope: spec/decisions/0009-canonical-vehicle-telemetry-envelope.md
      - 0010 Evidence-based status: spec/decisions/0010-evidence-based-requirement-status.md
    - Architecture:
